button.danger{color:var(--bad);border-color:var(--bad)}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}

#printArea{display:none}

function isLate(sh){
  const end = new Date(ST.date+'T00:00:00');
  if(sh==='صباحي'){ end.setHours(15,0,0,0); }
  else { end.setDate(end.getDate()+1); end.setHours(6,0,0,0); }
  return Date.now() > end.getTime();
}

function getQ(){ 
  try{ return JSON.parse(localStorage.getItem('kq')||'[]'); }catch(e){ return []; } 
}

function setQ(q){ 
  try{ localStorage.setItem('kq', JSON.stringify(q)); }catch(e){} 
}

async function flushQ(){
  const q = getQ();
  if(!q.length || !navigator.onLine || !ST.user) return;
  const keep = [];
  for(const it of q){
    try{ await setDoc(doc(fdb,'done',it.id), it.rec); }catch(e){ keep.push(it); }
  }
  setQ(keep);
}

window.addEventListener('online', flushQ);

function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fmtDate(s){
  const [y,m,d]=s.split('-');
  return d+'/'+m+'/'+y;
}

function weekday(s){
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('ar-EG',{weekday:'long'});
}

const okS = s => s==='approved'||s==='done';
const subS = s => s==='approved' || s==='done' || s==='pending';

function stLabel(s){
  return ({approved:'Done 👍',done:'Done 👍',pending:'Done 👍',rejected:'مرفوضة، أعيد التصوير'})[s]||'لسه';
}

function stCls(s){
  return (s==='approved'||s==='done'||s==='pending')?'done':(s==='rejected'?'review':'');
}

function taskList(sh){
  return TASKS.filter(t=>t.active!==false && t.shift===sh).sort((a,b)=>(a.order||0)-(b.order||0));
}

function findTask(id){
  return TASKS.find(t=>t.id===id);
}

function recOf(taskId, sh){
  return DONE.find(r=>r.taskId===taskId && r.shift===sh);
}

function triggerNotify(msg) {
  ST.latestAlert = msg;
  if ('Notification' in window && Notification.permission === 'granted') {

}

if ('Notification' in window && Notification.permission === 'default') {

function fail(ctx, e){ 
  alert(ctx+' ما اتمش.\nاتأكد من النت، ولو فضلت المشكلة كلم المدير.\n('+((e&&(e.code||e.message))||'')+')'); 
}

function refresh(){ 
  if(ST.role==='emp' && ST.cur) return; 
  render(); 
}

let unsubTasks = null;
function subTasks(){
  if(unsubTasks) unsubTasks();
  unsubTasks = onSnapshot(collection(fdb,'tasks'), s=>{ 
    TASKS = s.docs.map(d=>({id:d.id,...d.data()})); 
    refresh(); 
  }, e=>console.warn(e));
}

function refreshAll(){ 
  if(!ST.user) return; 
  subTasks(); 
  subDone(); 
  if(ST.role==='mgr') loadReport(); 
  render(); 
}

function subDone(){
  if(unsubDone) unsubDone();
  unsubDone = onSnapshot(query(collection(fdb,'done'), where('date','==',ST.date)),
    s=>{ 
      const prevCount = DONE.length;
      DONE = s.docs.map(d=>({id:d.id,...d.data()})); 
      if (DONE.length > prevCount && prevCount !== 0) {
        const newest = DONE[DONE.length - 1];
        if (newest.isViolation) {
          triggerNotify(`🚨 خطر سلامة غذاء: تسجيل قراءة غير مطابقة للمواصفات من الموظف (${newest.employee})`);
        } else {
          triggerNotify(`تم إنجاز تسليم جديد في الشيفت الحالي بواسطة (${newest.employee})`);
        }
      }
      refresh(); 
    }, e=>console.warn(e));
}

onAuthStateChanged(auth, u=>{
  ST.authReady = true;
  ST.user = u;
  if(u){
    ST.role = (u.email||'').toLowerCase() === MANAGER_EMAIL ? 'mgr' : 'emp';
    ST.name = ST.role==='mgr' ? 'المدير' : (u.email||'').split('@')[0];
    ST.date = todayStr(); 
    subDone(); 
    subTasks();
    if(ST.role==='mgr') loadReport();
    flushQ();
  }else{
    ST.role=null; 
    ST.cur=null; 
    if(unsubDone) unsubDone(); 
    if(unsubTasks) unsubTasks(); 
    DONE=[]; 
    TASKS=[];
  }
  render();
});

/* ---------- AI Bot Evaluation Engine ---------- */
function calcAIScores(sh) {
  const list = taskList(sh);
  if (!list.length) return { cleanScore: 100, haccpScore: 100, totalPct: 0, violations: 0 };
  
  let cleanTotal = 0, cleanDone = 0;
  let haccpTotal = 0, haccpDone = 0;
  let violations = 0;

  list.forEach(t => {
    const r = recOf(t.id, sh);
    const isDone = r && okS(r.status);
    
    if (t.zone === 'سلامة الغذاء' || t.type === 'temp') {
      haccpTotal++;
      if (isDone) {
        if (r.isViolation) {
          violations++;
        } else {
          haccpDone++;
        }
      }
    } else {
      cleanTotal++;
      if (isDone) cleanDone++;
    }
  });

  const cleanScore = cleanTotal ? Math.round((cleanDone / cleanTotal) * 100) : 100;
  const haccpBase = haccpTotal ? Math.round((haccpDone / haccpTotal) * 100) : 100;
  const haccpScore = Math.max(0, haccpBase - (violations * 20));
  
  const doneCount = list.filter(t=>okS(recOf(t.id,sh)?.status)).length;
  const totalPct = Math.round((doneCount / list.length) * 100);

  return { cleanScore, haccpScore, totalPct, violations };
}

async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = document.getElementById('cam');
    if(v){ v.srcObject = camStream; v.style.display='block'; document.getElementById('ph').style.display='none'; }
  }catch(e){
    const ph = document.getElementById('ph');
    if(ph) ph.innerHTML = 'الكاميرا ما فتحتش ('+(e.name||'خطأ')+').<br>اسمح بالكاميرا للمتصفح من إعدادات الموقع، واضغط "فتح الكاميرا من جديد".';
  }
}

function stopCam(){ 
  if(camStream){ 
    camStream.getTracks().forEach(t=>t.stop()); 
    camStream=null; 
  } 
}

function capture(){
  const v = document.getElementById('cam');
  if(!(v && v.srcObject && v.videoWidth)){ alert('الكاميرا مش مفتوحة. اضغط "فتح الكاميرا من جديد" الأول.'); return; }
  const w = 640, h = Math.round(640*v.videoHeight/v.videoWidth);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.drawImage(v,0,0,w,h);
  
  const imgData = ctx.getImageData(0, 0, w, h);
  let colorSum = 0;
  for (let i = 0; i < imgData.data.length; i += 4) {
    colorSum += (imgData.data[i] + imgData.data[i+1] + imgData.data[i+2]) / 3;
  }
  const brightness = colorSum / (w * h);

  if (brightness < 30) {
    alert('🤖 البوت التلقائي: الصورة مظلمة جداً وغير واضحة! يرجى تشغيل الإضاءة وإعادة التصوير لنظافة المكان.');
    return;
  }

  ST.photo = c.toDataURL('image/jpeg',0.6); ST.taken = true;
  stopCam();
  v.style.display='none';
  const img = document.getElementById('shot'); img.src = ST.photo; img.style.display='block';
  document.getElementById('ph').style.display='none';
  document.getElementById('capBtn').style.display='none';
  document.getElementById('startBtn').style.display='none';
  document.getElementById('retakeBtn').style.display='block';
  document.getElementById('sendBtn').style.display='block';
}

function retake(){ 
  ST.photo=null; 
  ST.taken=false; 
  render(); 
  startCam(); 
}

async function submitPhoto(){
  if(ST.busy || !ST.taken) return;
  const t = findTask(ST.cur);
  if(t.type === 'temp' && (!ST.inputVal || ST.inputVal.trim() === '')){
    alert('من فضلك أدخل درجة الحرارة بالأرقام أولاً.');
    return;
  }
  
  let isViolation = false;
  if(t.type === 'temp') {
    const num = parseFloat(ST.inputVal);
    if (t.limitType === 'max' && num > t.limit) isViolation = true;
    if (t.limitType === 'min' && num < t.limit) isViolation = true;
  }

  ST.busy = true;
  document.getElementById('sendBtn').disabled = true;
  const now = new Date();
  const id = ST.date+'_'+SK[ST.shift]+'_'+t.id+'_'+ST.user.uid.slice(0,6);
  const rec = {
    date: ST.date, ym: ST.date.slice(0,7),
    year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
    shift: ST.shift, taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
    time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
    photo: ST.photo, value: ST.inputVal || '', isViolation: isViolation, status: 'approved'
  };

  try{
    await setDoc(doc(fdb,'done',id), rec);
    if(isViolation) {
      triggerNotify(`🚨 تنبيه خطر: القراءة المسجلة لـ (${t.name}) مخالفة لسلامة الغذاء!`);
    }
    ST.busy = false; closeTask();
  }catch(e){
    ST.busy = false; document.getElementById('sendBtn').disabled = false;
    const q = getQ(); q.push({id, rec}); setQ(q);
    closeTask();
    alert('النت مش شغال. المهمة اتحفظت على الموبايل وهتتبعت أوتوماتيك لما النت يرجع.');
  }
}

async function mergeDefaultTasks(){
  try {
    const existingNames = new Set(TASKS.map(t => t.name));
    let addedCount = 0;
    
    for (const [shift, zone, name, type, limit, limitType] of DEFAULT_TASKS) {
      if (!existingNames.has(name)) {
        await addDoc(collection(fdb,'tasks'), {
          name, zone, shift, type: type||'bool', limit: limit||0, limitType: limitType||'none', order: Date.now() + addedCount, active:true
        });
        addedCount++;
      }
    }
    alert(`تمت تفعيل وإضافة عدد (${addedCount}) مهمة جديدة بنجاح وتظهر الآن لكل الموظفين!`);
  } catch(e) {
    fail('دمج المهام', e);
  }
}

function autoMergeOnOpen() {
  if (ST.tab === 'tasks' && ST.role === 'mgr' && TASKS.length > 0) {
    const existingNames = new Set(TASKS.map(t => t.name));
    let needsMerge = false;
    for (const [shift, zone, name] of DEFAULT_TASKS) {
      if (!existingNames.has(name)) { needsMerge = true; break; }
    }
    if (needsMerge) {
      mergeDefaultTasks();
    }
  }
}

function addTask(){
  const name = document.getElementById('nt_name').value.trim();
  const zone = document.getElementById('nt_zone').value.trim() || 'عام';
  const shift = document.getElementById('nt_shift').value;
  const type = document.getElementById('nt_type').value;
  if(!name){ alert('اكتب اسم المهمة'); return; }
  addDoc(collection(fdb,'tasks'), {name, zone, shift, type, order: Date.now(), active:true}).catch(e=>fail('إضافة المهمة', e));
}

function editTip(id){
  const t = findTask(id);
  const cur = t.tip || TIPS[t.name] || '';
  const v = prompt('اكتب النصيحة للمهمة (هتظهر للموظف):', cur);
  if(v === null) return;
  updateDoc(doc(fdb,'tasks',id), {tip: v.trim()}).catch(e=>fail('حفظ النصيحة', e));
}
