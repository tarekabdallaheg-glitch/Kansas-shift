<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5B800">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>KANSAS CHICKEN - نظام إدارة الشيفتات</title>
<style>
:root{--bg:#f8f9fa;--card:#ffffff;--text:#1a202c;--muted:#718096;--main:#F5B800;--onmain:#1a202c;--ok:#2f855a;--warn:#d69e2e;--bad:#e53e3e;--line:#e2e8f0;--brand:#C53030;--shadow:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06)}
*{box-sizing:border-box;min-width:0}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
#app{width:100%;max-width:480px;margin:0 auto;padding:16px;overflow-x:hidden}

/* App Header */
.app-header{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px 16px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;border:1px solid var(--line)}
.app-logo-sm{width:40px;height:40px;border-radius:12px;background:var(--main);color:var(--brand);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0;z-index:100;box-shadow:0 -4px 6px -1px rgba(0,0,0,0.05)}
.nav-item{background:none;border:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:4px 12px;margin:0;width:auto}
.nav-item.active{color:var(--brand);font-weight:bold}

/* Cards & UI */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;outline:none;transition:border-color 0.2s}
input:focus,select:focus{border-color:var(--main)}
button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--main);color:var(--onmain);font-size:15px;font-weight:bold;cursor:pointer;margin-top:8px;box-shadow:var(--shadow);transition:opacity 0.2s}
button:active{opacity:0.9}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
button.danger{background:#fff5f5;color:var(--bad);border:1px solid #feb2b2;box-shadow:none}
button.small{width:auto;padding:6px 12px;margin:0;font-size:12px}

/* Tabs & Tasks */
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;margin:0;padding:10px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;font-size:13px;text-align:center;cursor:pointer}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:bold}
.task{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:transform 0.1s}
.task:active{transform:scale(0.98)}
.task .t{flex:1}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--muted)}
.dot.done{background:var(--ok)}.dot.review{background:var(--warn)}.dot.bad{background:var(--bad)}
.tag{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--line);color:var(--muted);white-space:nowrap;font-weight:600}
.tag.done{background:#def7ec;color:var(--ok)}.tag.review{background:#fef08a;color:#713f12}.tag.bad{background:#fde8e8;color:var(--bad)}

/* Camera & Media */
#cam{width:100%;aspect-ratio:3/4;background:#000;border-radius:14px;object-fit:cover;display:none}
#shot{width:100%;border-radius:14px;display:none}
.placeholder{width:100%;aspect-ratio:3/4;background:#1a202c;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#e2e8f0;font-size:14px;text-align:center;padding:16px}
.meta{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}

/* Login & Splash */
.login-wrap{padding-top:40px}
.logo{width:80px;height:80px;margin:0 auto;border-radius:24px;background:var(--main);color:var(--brand);font-size:48px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(245,184,0,0.4)}
.brand-title{font-size:26px;font-weight:900;color:var(--brand);text-align:center;letter-spacing:1px;margin-top:16px}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:999}
.sp-bar{width:140px;height:4px;border-radius:4px;background:var(--line);margin-top:20px;overflow:hidden}
.sp-bar>div{height:100%;width:0;background:var(--brand);animation:fill 1.5s ease-in-out forwards}
@keyframes fill{to{width:100%}}

/* Dark Mode */
@media (prefers-color-scheme: dark){
:root{--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#94a3b8;--line:#334155;--brand:#f87171}
.bottom-nav{background:#1e293b;border-top-color:#334155}
}
</style>
</head>

let GEM = null;
async function gemini(){
  if(GEM !== null) return GEM;
  try{

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('انتهى الوقت')), ms))]); }

function imageBrightness(photo){
  return new Promise(res=>{
    if(!photo) return res(0);
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = 64; c.height = Math.max(1, Math.round(64*img.height/img.width));
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      let sum = 0, n = 0;
      for(let i=0; i<d.length; i+=4){ sum += (d[i]+d[i+1]+d[i+2])/3; n++; }
      res(n ? sum/n : 0);
    };
    img.onerror = ()=>res(0);
    img.src = photo;
  });
}

function isHygieneTask(t){
  const n = t.name || ''; const z = t.zone || '';
  return n.includes('حرارة') || n.includes('الثلاجات') || n.includes('الفريزر') || n.includes('الهايجين') || n.includes('غسل');
}

let AIMOD = null;
async function geminiGen(parts){
  if(!AIMOD){
    try{
      const m = await import('https://www.gstatic.com/firebasejs/13.1.0/firebase-ai.js');
      AIMOD = { m, ai: m.getAI(app, { backend: new m.GoogleAIBackend() }) };
    }catch(e){ throw new Error('AI غير مفعّل'); }
  }
  for(const name of ['gemini-2.5-flash-lite','gemini-2.5-flash']){
    try{
      const model = AIMOD.m.getGenerativeModel(AIMOD.ai, { model: name });
      return await withTimeout(model.generateContent(parts), 25000);
    }catch(e){}
  }
  throw new Error('فشل الفحص الذكي');
}

async function aiCleanCheck(t, photo){
  if(!photo) return { verdict:'unsure', reason:'مفيش صورة' };
  try{
    const r = await geminiGen([
      { text: 'المهمة: "' + t.name + '". هل الصورة مطابقة؟ رد بـ JSON فقط بالشكل: {"verdict":"pass" أو "fail","reason":"سبب قصير"}' },
      { inlineData: { mimeType:'image/jpeg', data: photo.split(',')[1] } }
    ]);
    const txt = (r.response.text() || '').replace(/```json/gi,'').replace(/```/g,'');
    const obj = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}')+1));
    return { verdict: String(obj.verdict||'').toLowerCase(), reason: obj.reason || '' };
  }catch(e){ return { verdict:'pass', reason:'مقبولة' }; }
}

async function botCheckHygiene(t, photo, tempVal){
  const bright = await imageBrightness(photo);
  if(bright < 40) return { status:'pending', violation:false, reason:'الصورة معتمة، المدير يراجعها' };
  const ai = await aiCleanCheck(t, photo);
  if(ai.verdict === 'fail') return { status:'rejected', violation:true, reason:'جيمي: ' + ai.reason };
  return { status:'done', violation:false, reason:'مقبولة' };
}

const DEFAULT_TASKS = [
 ['صباحي','الواجهة','عتب الأبواب'],['صباحي','الواجهة','الزجاج'],['صباحي','المطبخ','فحص الثلاجات وتسجيل درجة الحرارة'],
 ['صباحي','المطبخ','تشغيل الزيت في المقلاة وفحص نظافته'],['مسائي','المطبخ','تصفية زيت المقلاة وتنظيفها'],['مسائي','المخزن','تأمين المخزن وتسجيل الجرد اليومي']
];

const SHIFTS = ['صباحي','مسائي'];
const ST = { user:null, role:null, name:'', shift:'صباحي', tab:'rev', date:todayStr(), cur:null, photo:null, taken:false, busy:false, authErr:'', view:'tasks' };
let TASKS=[], DONE=[], unsubDone=null, camStream=null;

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDate(s){const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const okS = s => s==='approved'||s==='done';
const subS = s => s==='pending' || s==='done' || s==='approved';
function stLabel(s){ return ({done:'معتمدة 👍',approved:'معتمدة ✅',pending:'قيد المراجعة ⏳',rejected:'مرفوضة ❌'})[s]||'لسه'; }
function stCls(s){return (s==='approved'||s==='done')?'done':(s==='pending'?'review':s==='rejected'?'bad':'');}
function taskList(sh){return TASKS.filter(t=>t.active!==false && t.shift===sh);}
function findTask(id){return TASKS.find(t=>t.id===id);}
function recOf(taskId, sh){return DONE.find(r=>r.taskId===taskId && r.shift===sh);}

onAuthStateChanged(auth, u=>{
  ST.authReady = true; ST.user = u;
  if(u){
    ST.role = (u.email||'').toLowerCase() === MANAGER_EMAIL ? 'mgr' : 'emp';
    ST.name = ST.role==='mgr' ? 'المدير' : (u.email||'').split('@')[0];
    subDone(); subTasks();
  } else { ST.role=null; ST.cur=null; DONE=[]; TASKS=[]; }
  render();
});

function subTasks(){
  onSnapshot(collection(fdb,'tasks'), s=>{ TASKS = s.docs.map(d=>({id:d.id,...d.data()})); render(); });
}
function subDone(){
  onSnapshot(query(collection(fdb,'done'), where('date','==',ST.date)), s=>{ DONE = s.docs.map(d=>({id:d.id,...d.data()})); render(); });
}

function render(){
  const app = document.getElementById('app');
  if(!ST.splashDone || !ST.authReady){ app.innerHTML = `<div class="splash"><div class="logo">K</div><div class="sp-bar"><div></div></div></div>`; return; }
  if(!ST.user){
    app.innerHTML = `<div class="login-wrap"><div class="logo">K</div><div class="brand-title">KANSAS CHICKEN</div>
    <div class="card" style="margin-top:24px"><label>الإيميل</label><input id="lemail" type="email"><label>الباسورد</label><input id="lpass" type="password">
    <button onclick="login()">دخول للنظام</button>${ST.authErr?`<div style="color:var(--bad);margin-top:8px">${esc(ST.authErr)}</div>`:''}</div></div>`;
    return;
  }
  if(ST.cur){ app.innerHTML = taskView(); return; }

  let content = '';
  if(ST.role==='mgr'){
    if(ST.tab==='rev') content = mgrRevView();
    else if(ST.tab==='links') content = customerLinksView();
    else content = `<div class="card"><h3>تقرير الأداء والمهام</h3></div>`;
  } else {
    if(ST.view==='tasks') content = empTasksView();
    else if(ST.view==='ref') content = `<div class="card"><h3>مرجع سلامة الغذاء</h3><p class="muted">الالتزام بقواعد الهايجين ودرجات الحرارة أساس العمل.</p></div>`;
    else content = `<div class="card"><h3>المساعد الذكي</h3><p class="muted">اسأل عن أي استفسار يخص الهايجين والتشغيل.</p></div>`;
  }

  app.innerHTML = `
    <div class="app-header">
      <div style="display:flex;align-items:center;gap:10px">
        <div class="app-logo-sm">K</div>
        <div><h1>كنساس فرايد تشيكن</h1><div class="muted">${esc(ST.name)} · ${fmtDate(ST.date)}</div></div>
      </div>
      <button class="sec small" onclick="logout()">خروج</button>
    </div>
    ${content}
    <div class="bottom-nav">
      ${ST.role==='mgr' ? `
        <button class="nav-item ${ST.tab==='rev'?'active':''}" onclick="ST.tab='rev';render()">📋 المراجعة</button>
        <button class="nav-item ${ST.tab==='links'?'active':''}" onclick="ST.tab='links';render()">⭐ التقييمات</button>
      ` : `
        <button class="nav-item ${ST.view==='tasks'?'active':''}" onclick="ST.view='tasks';render()">📋 المهام</button>
        <button class="nav-item ${ST.view==='ref'?'active':''}" onclick="ST.view='ref';render()">📖 المرجع</button>
        <button class="nav-item ${ST.view==='chat'?'active':''}" onclick="ST.view='chat';render()">🤖 المساعد</button>
      `}
    </div>`;
}

function empTasksView(){
  const list = taskList(ST.shift);
  const rows = list.map(t=>{
    const r = recOf(t.id, ST.shift);
    const st = r ? r.status : 'todo';
    return `<div class="task" onclick="ST.cur='${t.id}';render();startCam()">
      <span class="dot ${stCls(st)}"></span>
      <div class="t"><div><b>${esc(t.name)}</b></div><div class="muted">${esc(t.zone)}</div></div>
      <span class="tag ${stCls(st)}">${stLabel(st)}</span>
    </div>`;
  }).join('') || '<div class="card muted">لا توجد مهام حالياً.</div>';

  return `
    <div class="card">
      <label>اختر الشيفت الحالي</label>
      <select onchange="ST.shift=this.value;render()">
        <option ${ST.shift==='صباحي'?'selected':''}>صباحي</option>
        <option ${ST.shift==='مسائي'?'selected':''}>مسائي</option>
      </select>
    </div>
    ${rows}`;
}

function customerLinksView(){
  return `
    <div class="card" style="background:linear-gradient(135deg,#fffbf0,#fff)">
      <h3 style="margin-top:0">⭐ تقييمات العملاء بمنصات الإنترنت</h3>
      <p class="muted">متابعة آراء العملاء لرفع جودة الخدمة والتشغيل:</p>
      <div style="display:flex;gap:8px;margin-top:12px">
        <a href="https://maps.google.com" target="_blank" style="flex:1;text-decoration:none"><button class="sec" style="margin-top:0;color:#4285F4;border-color:#4285F4">📍 جوجل خرائط</button></a>
        <a href="https://www.talabat.com" target="_blank" style="flex:1;text-decoration:none"><button class="sec" style="margin-top:0;color:#FF5A00;border-color:#FF5A00">🛵 تطبيق طلبات</button></a>
      </div>
    </div>
    <div class="card">
      <h3>📊 تسجيل مؤشر رضا العملاء</h3>
      <label>تقييم جوجل (من 5):</label><input type="number" step="0.1" placeholder="4.7">
      <label>تقييم طلبات (من 5):</label><input type="number" step="0.1" placeholder="4.9">
      <button onclick="alert('تم حفظ مؤشرات رضا العملاء بنجاح!')" style="margin-top:12px">حفظ بالسجل</button>
    </div>`;
}

function mgrRevView(){
  return `<div class="card"><h3>مراجعة مهام الشيفتات اليومية</h3><p class="muted">متابعة الصور واعتماد أو رفض المهام لحظياً.</p></div>`;
}

function taskView(){
  const t = findTask(ST.cur);
  return `
    <div class="app-header"><button class="sec small" onclick="ST.cur=null;stopCam();render()">رجوع</button><span>${esc(t.zone)}</span></div>
    <h2>إنجاز المهمة: ${esc(t.name)}</h2>
    <div class="card">
      <video id="cam" autoplay playsinline muted></video>
      <img id="shot" alt="">
      <div id="ph" class="placeholder">جاري تشغيل الكاميرا...</div>
    </div>
    <button id="capBtn" onclick="capture()">التقاط صورة</button>
    <button id="sendBtn" style="display:none" onclick="submitPhoto()">إرسال وفحص بالذكاء الاصطناعي</button>`;
}

async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = document.getElementById('cam');
    if(v){ v.srcObject = camStream; v.style.display='block'; document.getElementById('ph').style.display='none'; }
  }catch(e){ alert('تعذر تشغيل الكاميرا'); }
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

function capture(){
  const v = document.getElementById('cam');
  const c = document.createElement('canvas'); c.width=640; c.height=Math.round(640*v.videoHeight/v.videoWidth);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  ST.photo = c.toDataURL('image/jpeg',0.6); ST.taken = true;
  stopCam(); v.style.display='none';
  document.getElementById('shot').src = ST.photo; document.getElementById('shot').style.display='block';
  document.getElementById('capBtn').style.display='none';
  document.getElementById('sendBtn').style.display='block';
}

async function submitPhoto(){
  const t = findTask(ST.cur);
  const check = await botCheckHygiene(t, ST.photo, null);
  const id = ST.date+'_'+ST.shift+'_'+t.id;
  await setDoc(doc(fdb,'done',id), { date:ST.date, shift:ST.shift, taskId:t.id, taskName:t.name, zone:t.zone, employee:ST.name, photo:ST.photo, status:check.status });
  if(check.status==='rejected') await sendTelegramAlert(`🚨 مخالفة في كنساس!\nالمهمة: ${t.name}\nالسبب: ${check.reason}`);
  ST.cur=null; render();
}

async function login(){
  try{ await signInWithEmailAndPassword(auth, document.getElementById('lemail').value.trim(), document.getElementById('lpass').value); }
  catch(e){ ST.authErr = 'خطأ في بيانات الدخول'; render(); }
}
function logout(){ signOut(auth); }

setTimeout(()=>{ ST.splashDone=true; render(); }, 1200);
Object.assign(window, { ST, render, login, logout, startCam, capture, submitPhoto });
</script>
