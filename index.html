label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:bold}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--main)}
button{width:100%;padding:14px;border:0;border-radius:14px;background:var(--main);color:var(--onmain);font-size:15px;font-weight:bold;cursor:pointer;margin-top:10px;box-shadow:0 4px 12px rgba(245,184,0,0.25)}
button:active{transform:scale(0.98)}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none}
button.danger{background:#ffebee;color:var(--bad);border:1px solid #ffcdd2;box-shadow:none}
button.small{width:auto;padding:6px 12px;margin:0;font-size:12px}

/* Tabs & Tasks */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tab{flex:1;margin:0;padding:10px 12px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;font-size:13px;text-align:center;cursor:pointer;white-space:nowrap;font-weight:600}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.task{display:flex;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow)}
.task .t{flex:1}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--muted)}
.dot.done{background:var(--ok)}.dot.review{background:var(--warn)}.dot.bad{background:var(--bad)}
.tag{font-size:12px;padding:4px 10px;border-radius:10px;background:var(--line);color:var(--muted);white-space:nowrap;font-weight:bold}
.tag.done{background:#e8f5e9;color:var(--ok)}.tag.review{background:#fff4e0;color:var(--warn)}.tag.bad{background:#ffebee;color:var(--bad)}

/* Media & Camera */
#cam{width:100%;aspect-ratio:3/4;background:#000;border-radius:16px;object-fit:cover;display:none}
#shot{width:100%;border-radius:16px;display:none}
.placeholder{width:100%;aspect-ratio:3/4;background:#2b3440;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#cfd8e1;font-size:14px;text-align:center;padding:16px}
.meta{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}th{color:var(--muted);font-weight:bold}
.badbox{background:#ffebee;color:var(--bad);border:1px solid #ffcdd2;border-radius:14px;padding:14px;font-size:13px;margin-bottom:14px}
.rec{page-break-inside:avoid;border-bottom:1px solid var(--line);padding:12px 0}.rec img{width:100%;max-width:280px;display:block;margin-top:8px;border-radius:12px}

.brand-title{font-size:28px;font-weight:900;color:var(--brand);text-align:center;letter-spacing:1px;margin-top:16px}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:999}
.sp-bar{width:160px;height:4px;border-radius:4px;background:var(--line);margin-top:22px;overflow:hidden}
.sp-bar>div{height:100%;width:0;background:var(--brand);animation:fill 1.5s ease-in-out forwards}
@keyframes fill{to{width:100%}}

#printArea{display:none}
@media print{body{background:#fff}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:16px}}

function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('انتهى الوقت')), ms))]); }

function imageBrightness(photo){
  return new Promise(res=>{
    if(!photo) return res(0);
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = 64; c.height = Math.max(1, Math.round(64*img.height/img.width));
      const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      let sum = 0, n = 0;
      for(let i=0; i<d.length; i+=4){ sum += (d[i]+d[i+1]+d[i+2])/3; n++; }
      res(n ? sum/n : 0);
    };
    img.onerror = ()=>res(0);
    img.src = photo;
  });
}

let AIMOD = null;
async function geminiGen(parts){
  if(!AIMOD){
    try{
      const m = await import('https://www.gstatic.com/firebasejs/13.1.0/firebase-ai.js');
      AIMOD = { m, ai: m.getAI(app, { backend: new m.GoogleAIBackend() }) };
    }catch(e){ throw new Error('AI غير مفعّل'); }
  }
  for(const name of ['gemini-2.5-flash-lite','gemini-2.5-flash']){
    try{
      const model = AIMOD.m.getGenerativeModel(AIMOD.ai, { model: name });
      return await withTimeout(model.generateContent(parts), 25000);
    }catch(e){}
  }
  throw new Error('فشل الفحص الذكي');
}

async function aiCleanCheck(t, photo){
  if(!photo) return { verdict:'unsure', reason:'مفيش صورة' };
  try{
    const r = await geminiGen([
      { text: 'المهمة: "' + t.name + '". هل الصورة مطابقة؟ رد بـ JSON فقط بالشكل: {"verdict":"pass" أو "fail","reason":"سبب قصير"}' },
      { inlineData: { mimeType:'image/jpeg', data: photo.split(',')[1] } }
    ]);
    const txt = (r.response.text() || '').replace(/```json/gi,'').replace(/```/g,'');
    const obj = JSON.parse(txt.substring(txt.indexOf('{'), txt.lastIndexOf('}')+1));
    return { verdict: String(obj.verdict||'').toLowerCase(), reason: obj.reason || '' };
  }catch(e){ return { verdict:'pass', reason:'مقبولة' }; }
}

async function botCheckHygiene(t, photo, tempVal){
  const bright = await imageBrightness(photo);
  if(bright < 40) return { status:'pending', violation:false, reason:'الصورة معتمة، المدير يراجعها' };
  const ai = await aiCleanCheck(t, photo);
  if(ai.verdict === 'fail') return { status:'rejected', violation:true, reason:'جيمي: ' + ai.reason };
  return { status:'done', violation:false, reason:'مقبولة' };
}

}

function mgrTasksView(){
  if(!TASKS.length) return `<div class="card"><p class="muted">مفيش مهام لسه.</p><button onclick="importDefaults()">استيراد المهام الافتراضية</button></div>`;
  const lists = SHIFTS.map(sh=>{
    const items = TASKS.filter(t=>t.shift===sh).map(t=>`
      <div class="task" style="cursor:default">
        <div class="t">${esc(t.name)}<div class="muted">${esc(t.zone)}</div></div>
        <button class="sec small danger" onclick="delTask('${t.id}')">حذف</button>
      </div>`).join('');
    return `<div class="card"><b>شيفت ${sh}</b>${items||'<div class="muted">لا توجد مهام</div>'}</div>`;
  }).join('');
  return `
    <div class="card"><h2>إضافة مهمة جديدة</h2>
      <label>اسم المهمة</label><input id="nt_name">
      <label>المنطقة</label><input id="nt_zone" placeholder="مطبخ، صالة...">
      <label>الشيفت</label><select id="nt_shift"><option>صباحي</option><option>مسائي</option></select>
      <button onclick="addTask()">إضافة المهمة</button>
    </div>
    ${lists}`;
}

function addTask(){
  const name = document.getElementById('nt_name').value.trim();
  const zone = document.getElementById('nt_zone').value.trim() || 'عام';
  const shift = document.getElementById('nt_shift').value;
  if(!name){ alert('اكتب اسم المهمة'); return; }
  addDoc(collection(fdb,'tasks'), {name, zone, shift, order:Date.now(), active:true}).then(()=>render());
}
function delTask(id){ if(confirm('متأكد من الحذف؟')) deleteDoc(doc(fdb,'tasks',id)).then(()=>render()); }
function importDefaults(){
  Promise.all(DEFAULT_TASKS.map(([shift,zone,name],i)=>addDoc(collection(fdb,'tasks'), {name, zone, shift, order:i+1, active:true}))).then(()=>render());
}

function mgrQuestionsView(){
  const cards = QS.map(q=>`
    <div class="card">
      <b>${esc(q.text)}</b>
      <div class="muted">${esc(q.employee)} · ${esc(q.shift)}</div>
      ${q.answered?`<div style="color:var(--ok);margin-top:6px">الرد: ${esc(q.answer)}</div>`:
      `<input id="ans_${q.id}" placeholder="اكتب الرد هنا"><button onclick="answerQ('${q.id}')">إرسال الرد</button>`}
    </div>`).join('') || '<div class="card muted">لا توجد أسئلة جديدة.</div>';
  return `<div class="card"><h3>أسئلة الموظفين</h3></div>${cards}`;
}

function answerQ(id){
  const v = (document.getElementById('ans_'+id).value||'').trim();
  if(!v) return;
  updateDoc(doc(fdb,'questions',id), {answer:v, answered:true}).then(()=>loadQuestions());
}

function mgrRepView(){
  const [y,m] = ST.month.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  let rows = '';
  for(let d=1; d<=days; d++){
    const date = ST.month+'-'+String(d).padStart(2,'0');
    const cnt = sh => ST.report.filter(r=>r.date===date && r.shift===sh && okS(r.status)).length;
    rows += `<tr><td>${d}</td><td>${cnt('صباحي')}</td><td>${cnt('مسائي')}</td></tr>`;
  }
  return `
    <div class="card">
      <label>الشهر</label><input type="month" value="${ST.month}" onchange="ST.month=this.value;loadReport();">
      <button onclick="window.print()" style="margin-top:10px">طباعة التقرير (PDF)</button>
    </div>
    <div class="card" style="overflow-x:auto">
      <table><tr><th>اليوم</th><th>صباحي</th><th>مسائي</th></tr>${rows}</table>
    </div>`;
}

function refView(){
  return REFERENCE.map(s=>`<div class="card"><b>${s.t}</b><ul style="padding-right:18px;margin:8px 0 0">${s.i.map(x=>`<li style="font-size:14px">${esc(x)}</li>`).join('')}</ul></div>`).join('');
}

function chatView(){
  const msgs = ST.chatMsgs.map(m=>`<div class="card" style="${m.who==='me'?'background:var(--bg)':''}"><b>${m.who==='me'?'أنت':'البوت'}</b><div>${esc(m.text)}</div></div>`).join('') || '<div class="muted">اسألني عن معايير الهايجين وسلامة الغذاء.</div>';
  return `
    ${msgs}
    <div class="card">
      <input id="botQ" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key==='Enter')askBot()">
      <button onclick="askBot()">إرسال</button>
    </div>`;
}

async function askBot(){
  const el = document.getElementById('botQ'); const q = (el.value||'').trim(); if(!q) return;
  ST.chatMsgs.push({who:'me', text:q}); el.value='';
  let ans = 'يرجى الالتزام التام بمعايير النظافة والهايجين بمطعم كنساس.';
  const m = await gemini();
  if(m){ try{ const r = await m.generateContent([{text:q}]); ans = r.response.text(); }catch(e){} }
  ST.chatMsgs.push({who:'bot', text:ans}); render();
}

function taskView(){
  const t = findTask(ST.cur);
  return `
    <div class="app-header"><button class="sec small" onclick="ST.cur=null;stopCam();render()">رجوع</button><span>${esc(t.zone)}</span></div>
    <h2>إنجاز المهمة: ${esc(t.name)}</h2>
    <div class="card">
      <video id="cam" autoplay playsinline muted></video>
      <img id="shot" alt="">
      <div id="ph" class="placeholder">جاري تشغيل الكاميرا...</div>
    </div>
    <button id="capBtn" onclick="capture()">التقاط صورة</button>
    <button id="sendBtn" style="display:none" onclick="submitPhoto()">إرسال وفحص بالذكاء الاصطناعي</button>`;
}

async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = document.getElementById('cam');
    if(v){ v.srcObject = camStream; v.style.display='block'; document.getElementById('ph').style.display='none'; }
  }catch(e){ alert('تعذر تشغيل الكاميرا'); }
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

function capture(){
  const v = document.getElementById('cam');
  const c = document.createElement('canvas'); c.width=640; c.height=Math.round(640*v.videoHeight/v.videoWidth);
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  ST.photo = c.toDataURL('image/jpeg',0.6); ST.taken = true;
  stopCam(); v.style.display='none';
  document.getElementById('shot').src = ST.photo; document.getElementById('shot').style.display='block';
  document.getElementById('capBtn').style.display='none';
  document.getElementById('sendBtn').style.display='block';
}

async function submitPhoto(){
  const t = findTask(ST.cur);
  const check = await botCheckHygiene(t, ST.photo, null);
  const id = ST.date+'_'+ST.shift+'_'+t.id;
  await setDoc(doc(fdb,'done',id), { date:ST.date, ym:ST.date.slice(0,7), shift:ST.shift, taskId:t.id, taskName:t.name, zone:t.zone, employee:ST.name, photo:ST.photo, status:check.status, rejectReason:check.reason });
  if(check.status==='rejected') await sendTelegramAlert(`🚨 مخالفة في كنساس!\nالمهمة: ${t.name}\nالسبب: ${check.reason}`);
  ST.cur=null; render();
}

function setStatus(id, status){ updateDoc(doc(fdb,'done',id), {status}); }
function rejectRec(id){
  const why = prompt('سبب الرفض:', 'مخالفة معايير النظافة');
  if(why) updateDoc(doc(fdb,'done',id), {status:'rejected', rejectReason:why});
}
function removeRec(id){ if(confirm('حذف التسجيل؟')) deleteDoc(doc(fdb,'done',id)); }

async function login(){
  try{ await signInWithEmailAndPassword(auth, document.getElementById('lemail').value.trim(), document.getElementById('lpass').value); }
  catch(e){ ST.authErr = 'خطأ في بيانات الدخول'; render(); }
}
function logout(){ signOut(auth); }

setTimeout(()=>{ ST.splashDone=true; render(); }, 1200);
Object.assign(window, { ST, render, login, logout, startCam, capture, submitPhoto, setStatus, rejectRec, removeRec, addTask, delTask, importDefaults, answerQ, loadQuestions, askBot });
</script>
</body>
</html>
