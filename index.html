<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root {
  --bg:#f4f6f8;
  --card:#fff;
  --text:#1d2630;
  --muted:#6b7785;
  --main:#F5B800;
  --onmain:#1d2630;
  --ok:#2e7d32;
  --warn:#e08e00;
  --bad:#c62828;
  --line:#e3e8ee;
  --brand:#D32F2F;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(160deg,#fff7d6,#f4f6f8 45%,#ffe3e0) fixed;
  color:var(--text);
  min-height:100vh;
}
#app{max-width:520px;margin:auto;min-height:100vh;padding:16px}
h1{font-size:20px;margin:6px 0 4px}
h2{font-size:17px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.brand{
  font-size:30px;font-weight:900;color:var(--brand);
  text-align:center;letter-spacing:1px;margin-top:20px
}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:14px;margin-bottom:12px
}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{
  width:100%;padding:11px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:15px
}
textarea{min-height:80px}
button{
  width:100%;padding:13px;border:0;border-radius:12px;
  background:var(--main);color:var(--onmain);
  font-size:15px;font-weight:bold;cursor:pointer;margin-top:8px
}
button.sec{background:transparent;color:var(--text);border:1px solid var(--main)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.small{width:auto;padding:8px 10px;margin:0;font-size:13px}
button:disabled{opacity:.45}
.top,.row{
  display:flex;justify-content:space-between;
  align-items:center;gap:8px;margin-bottom:10px
}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  flex:1;min-width:65px;margin:0;padding:10px;
  background:var(--card);color:var(--text);
  border:1px solid var(--line)
}
.tab.on{background:var(--main);border-color:var(--main)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{flex:1;margin:0;padding:9px;font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--main)}
.task{
  display:flex;align-items:center;gap:10px;padding:12px;
  border-radius:12px;background:var(--card);
  border:1px solid var(--line);margin-bottom:8px;cursor:pointer
}
.task .t{flex:1}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:var(--muted)}
.dot.done{background:var(--ok)}
.dot.review{background:var(--warn)}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.done{background:#e8f5e9;color:var(--ok)}
.tag.review{background:#fff4e0;color:var(--warn)}
#cam{width:100%;aspect-ratio:3/4;background:#000;border-radius:12px;object-fit:cover;display:none}
#shot,.shot{width:100%;border-radius:10px;margin-top:8px;display:none}
.placeholder{
  width:100%;aspect-ratio:3/4;background:#2b3440;
  border-radius:12px;display:flex;align-items:center;
  justify-content:center;color:#cfd8e1;text-align:center;padding:16px
}
.meta{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
th{color:var(--muted);font-weight:normal}
.warnbox{background:#fff4e0;color:#8a5a00;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.logo{
  width:76px;height:76px;margin:0 auto;border-radius:22px;
  background:var(--main);color:var(--brand);font-size:44px;
  font-weight:900;display:flex;align-items:center;justify-content:center
}
.login-wrap{padding-top:36px}
.greet{text-align:center;color:var(--muted);margin:6px 0 18px}
.login-card{padding:20px;border-radius:20px;box-shadow:0 12px 30px #1d26301f;border:0}
.login-btn{padding:16px;font-size:17px}
.splash{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--bg);z-index:9
}
.sp-name{font-size:24px;font-weight:900;margin-top:18px;letter-spacing:2px;direction:ltr}
.sp-bar{width:140px;height:4px;border-radius:4px;background:var(--line);margin-top:22px;overflow:hidden}
.sp-bar>div{height:100%;width:100%;background:var(--main)}
.cover{max-width:380px;margin:auto;padding-top:24px;text-align:center}
#printArea{display:none}
.rec{page-break-inside:avoid;border-bottom:1px solid #ddd;padding:8px 0}
.rec img{width:100%;max-width:260px;display:block;margin-top:6px;border-radius:8px}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:12px}
  .emp-block{page-break-inside:avoid}
}
@media(prefers-color-scheme:dark){
  :root{--bg:#111820;--card:#1b2530;--text:#e8edf2;--muted:#9aa6b2;--line:#2a3643}
  body{background:var(--bg)!important}
  .brand{color:#ff6b6b}
  .warnbox{background:#3a2e14;color:#ffd58a}
  .tag{background:#2a3643}
  .tag.done{background:#1d3a22}
  .tag.review{background:#3d2f12}
}
</style>
</head>

async function login(){
 const email=$('email')?.value.trim();
 const password=$('password')?.value;
 if(!email || !password){
  notify('اكتب البريد الإلكتروني وكلمة المرور.');
  return;
 }
 try{
  await signInWithEmailAndPassword(auth,email,password);
 }catch(e){
  console.error(e);
  notify('تعذر تسجيل الدخول. راجع البريد الإلكتروني وكلمة المرور واتصال الإنترنت.');
 }
}

async function logout(){
 try{
  if(ST.cameraStream){
   ST.cameraStream.getTracks().forEach(t=>t.stop());
   ST.cameraStream=null;

function closeTask(){

  ST.cameraStream.getTracks().forEach(t=>t.stop());
  ST.cameraStream=null;
 }
 ST.activeTask=null;
 ST.capturedImage=null;

async function startCam(){
 const video=$('cam');
 if(!video){
  notify('افتح المهمة أولاً.');
  return;
 }
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   notify('المتصفح لا يدعم تشغيل الكاميرا. افتح الموقع عبر HTTPS.');
   return;
  }
  ST.cameraStream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'environment'},
   audio:false
  });
  video.srcObject=ST.cameraStream;
  video.style.display='block';
  const p=$('camPlaceholder');
  if(p)p.style.display='none';
  const shot=$('shot');
  if(shot)shot.style.display='none';
 }catch(e){
  console.error(e);
  notify('تعذر فتح الكاميرا. تأكد من إذن الكاميرا واستخدم الموقع عبر HTTPS.');
 }
}

function capture(){
 const video=$('cam');
 if(!video || !video.videoWidth){
  notify('شغّل الكاميرا وانتظر حتى تظهر الصورة.');
  return;
 }
 const canvas=document.createElement('canvas');
 canvas.width=video.videoWidth;
 canvas.height=video.videoHeight;
 canvas.getContext('2d').drawImage(video,0,0);
 ST.capturedImage=canvas.toDataURL('image/jpeg',0.75);
 const shot=$('shot');
 if(shot){
  shot.src=ST.capturedImage;
  shot.style.display='block';
 }
 video.style.display='none';
 if(ST.cameraStream){
  ST.cameraStream.getTracks().forEach(t=>t.stop());
  ST.cameraStream=null;
 }
}

function retake(){
 ST.capturedImage=null;
 const shot=$('shot');
 if(shot)shot.style.display='none';
 const video=$('cam');
 if(video)video.style.display='none';
 const p=$('camPlaceholder');
 if(p)p.style.display='flex';
}
  async function submitPhoto(){
 if(!ST.activeTask){
  notify('اختار المهمة الأول.');

 if(!ST.capturedImage){
  notify('لازم تلتقط صورة للمهمة الأول.');
  return;
 }

 const task=ST.tasks.find(t=>t.id===ST.activeTask);
 if(!task){
  notify('المهمة غير موجودة.');
  return;
 }

 try{
  await addDoc(collection(fdb,'records'),{
   taskId:task.id,
   taskName:task.name,
   section:task.section||'عام',
   shift:task.shift,
   date:today(),
   userEmail:ST.user.email,
   userName:ST.user.displayName||ST.user.email,
   image:ST.capturedImage,
   status:'review',
   createdAt:new Date().toISOString(),
   managerNote:''
  });

  notify('تم إرسال المهمة للمراجعة.');
  ST.capturedImage=null;
  ST.activeTask=null;
  await refreshAll();
 }catch(e){
  console.error(e);
  notify('تعذر إرسال المهمة. تأكد من اتصال الإنترنت وصلاحيات قاعدة البيانات.');
 }

async function addTask(){
 const name=$('newTaskName')?.value.trim();
 const section=$('newTaskSection')?.value.trim()||'عام';
 const shift=$('newTaskShift')?.value||'صباحي';

 if(!name){
  notify('اكتب اسم المهمة.');
  return;
 }

 try{
  await addDoc(collection(fdb,'tasks'),{
   name,section,shift,active:true,
   createdAt:new Date().toISOString()
  });
  await refreshAll();
  notify('تمت إضافة المهمة.');
 }catch(e){
  console.error(e);
  notify('تعذرت إضافة المهمة.');
 }
}

async function toggleTask(id){
 const t=ST.tasks.find(x=>x.id===id);
 if(!t)return;
 try{
  await updateDoc(doc(fdb,'tasks',id),{active:t.active===false});
  await refreshAll();
 }catch(e){
  console.error(e);
  notify('تعذر تعديل المهمة.');
 }
}

async function delTask(id){
 if(!confirm('هل تريد حذف المهمة؟'))return;
 try{
  await deleteDoc(doc(fdb,'tasks',id));
  await refreshAll();
 }catch(e){

  notify('تعذر حذف المهمة.');
 }
}

async function importDefaults(){
 if(!confirm('إضافة المهام الافتراضية إلى قاعدة البيانات؟'))return;
 try{
  const existing=new Set(ST.tasks.map(t=>`${t.shift}|${t.section}|${t.name}`));
  let count=0;
  for(const item of DEFAULT_TASKS){
   const [shift,section,name]=item;
   const key=`${shift}|${section}|${name}`;
   if(existing.has(key))continue;
   await addDoc(collection(fdb,'tasks'),{
    shift,section,name,active:true,
    createdAt:new Date().toISOString()
   });
   count++;
  }
  await refreshAll();
  notify(`تمت إضافة ${count} مهمة.`);
 }catch(e){
  console.error(e);
  notify('تعذر استيراد المهام.');
 }
}

async function askBot(){
 const el=$('botQ');
 if(!el)return;
 const question=el.value.trim();
 if(!question){
  notify('اكتب السؤال أولاً.');
  return;
 }

 const answer=$('botAnswer');
 if(answer)answer.textContent='جاري البحث عن إجابة...';

 const normalized=question.toLowerCase();
 const match=Object.entries(TIPS).find(([key,value])=>
  normalized.includes(key.toLowerCase())||
  key.toLowerCase().includes(normalized)
 );

 try{
  if(match){
   if(answer)answer.textContent=match[1];
  }else{
   await addDoc(collection(fdb,'questions'),{
    question,
    userEmail:ST.user?.email||'',
    date:today(),
    answer:'',
    createdAt:new Date().toISOString()
   });
   if(answer)answer.textContent='تم إرسال سؤالك للمدير للمراجعة.';
  }
 }catch(e){
  console.error(e);
  if(answer)answer.textContent='تعذر إرسال السؤال. حاول مرة أخرى.';
 }
}

 }
 try{

}

   .sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

}

async function refreshAll(){
 try{
  const [taskSnap,recordSnap]=await Promise.all([
   getDocs(collection(fdb,'tasks')),
   getDocs(collection(fdb,'records'))
  ]);

  ST.tasks=taskSnap.docs.map(d=>({id:d.id,...d.data()}));
  ST.records=recordSnap.docs.map(d=>({id:d.id,...d.data()}));

  render();
 }catch(e){
  console.error(e);
  notify('تعذر تحميل البيانات. راجع الإنترنت وصلاحيات Firestore.');
 }
}

function render(){
 const root=$('app');
 if(!root)return;

 if(!ST.splashDone){
  root.innerHTML=splashView();
  return;
 }

 if(!ST.authReady){
  root.innerHTML=`
   <div class="card" style="margin-top:40px;text-align:center">
    جاري التحقق من تسجيل الدخول...
   </div>`;
  return;
 }

 if(!ST.user){
  root.innerHTML=loginView();
  return;
 }

 if(ST.role==='manager'){
  root.innerHTML=mgrView();
 }else{
  root.innerHTML=employeeView();
 }
}

onAuthStateChanged(auth,async user=>{
 ST.user=user;
 ST.authReady=true;

 if(user){
  ST.role=(user.email||'').toLowerCase()===MANAGER_EMAIL.toLowerCase()
   ?'manager':'employee';

  await refreshAll();
 }else{
  ST.role='employee';
  ST.tasks=[];
  ST.records=[];
  ST.questions=[];
 }

 render();
});

setTimeout(()=>{
 ST.splashDone=true;
 render();
},1800);

Object.assign(window,{
 ST,render,login,logout,openTask,closeTask,startCam,capture,retake,
 submitPhoto,refreshAll,setTab,setShift,setDate,setStatus,rejectRec,
 removeRec,addTask,toggleTask,delTask,importDefaults,setMonth,
 setReportDay,askBot,answerQ,loadQuestions,approveRec,printReport
});

function setDate(d){
 ST.reportDay=d;
 render();
}

function setStatus(id,status){
 const r=ST.records.find(x=>x.id===id);
 if(!r)return;
 r.status=status;
 render();
}
