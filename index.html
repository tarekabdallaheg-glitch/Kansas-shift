.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}

button.sec{background:transparent;color:var(--text);border:1px solid var(--main)}
button.danger{color:var(--bad);border-color:var(--bad)}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;margin:0;padding:10px;background:var(--card);color:var(--text);border:1px solid var(--line)}
.tab.on{background:var(--main);color:var(--onmain);border-color:var(--main)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btns button{flex:1;margin:0;padding:9px;font-size:13px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--main)}

.warnbox{background:#fff4e0;color:#8a5a00;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.badbox{background:#ffebee;color:#c62828;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px}
.logo{width:76px;height:76px;margin:0 auto;border-radius:22px;background:var(--main);color:var(--brand);font-size:44px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(245,184,0,.35)}
body{background:linear-gradient(160deg,#fff7d6 0%,#f4f6f8 45%,#ffe3e0 100%) fixed}
.login-wrap{padding-top:36px}
.greet{text-align:center;color:var(--muted);margin:6px 0 18px;font-size:15px}
.login-card{padding:20px;border-radius:20px;box-shadow:0 12px 30px rgba(29,38,48,.12);border:0}

.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:9}
.sp-logo{animation:spIn .5s ease-out both}
@keyframes spIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.sp-name{font-size:24px;font-weight:900;margin-top:18px;letter-spacing:2px;direction:ltr}
.sl{display:inline-block;opacity:.25;color:var(--muted);animation:glow .3s ease-out forwards}
@keyframes glow{to{opacity:1;color:var(--brand);text-shadow:0 0 14px rgba(245,184,0,.95)}}
.sp-bar{width:140px;height:4px;border-radius:4px;background:var(--line);margin-top:22px;overflow:hidden}
.sp-bar>div{height:100%;width:0;background:var(--main);animation:fill 1.6s ease-in-out .1s forwards}
@keyframes fill{to{width:100%}}
.cover{max-width:380px;margin:0 auto;padding-top:24px;text-align:center}
.cover svg{width:100%;height:auto;display:block}
#printArea{display:none}

.badbox{background:#3a1d1d;color:#ff8a8a}

.rec{page-break-inside:avoid;border-bottom:1px solid #ddd;padding:8px 0}.rec img{width:100%;max-width:260px;display:block;margin-top:6px;border-radius:8px}

let GEM = null;
async function gemini(){
  if(GEM !== null) return GEM;
  try{
    const ai = getAI(app, { backend: new GoogleAIBackend() });
    GEM = getGenerativeModel(ai, { model: 'gemini-2.5-flash-lite' });
  }catch(e){ GEM = false; }
  return GEM;
}

async function aiCleanCheck(t, photo){
  const model = await gemini();
  if(!model) return { ok: false, reason: 'خطأ: نموذج الذكاء الاصطناعي (البوت الذكي) غير متاح حالياً.', cleanlinessScore: 0, hygieneScore: 0, taskMatch: false, findings: ['تعذر تشغيل فحص الصورة'] };
  if(!photo) return { ok: false, reason: 'خطأ: لم يتم التقاط صورة أو الصورة فارغة.', cleanlinessScore: 0, hygieneScore: 0, taskMatch: false, findings: ['لا توجد صورة للفحص'] };
  
  try{
    const r = await model.generateContent([
      { text: `أنت بوت ومفتش سلامة وصحة غذاء وهايجين صارم جداً لمطعم "كنساس فرايد تشيكن". المهمة هي: "${t.name}" في منطقة "${t.zone}". 
      قم بتحليل الصورة المرفقة بدقة تامة. 
      - إذا كانت الصورة مظلمة تماماً، سوداء، غير واضحة، فيها إهمال أو اتساخ، أو لا تعبر عن إتمام المهمة المطلوبة: ضع ok: false واكتب بوضوح تام "سبب الرفض بالتفصيل" باللغة العربية (مثلاً: الصورة مظلمة ولا توضح النظافة، أو يوجد اتساخ في المكان).
      - إذا كانت الصورة سليمة ومطابقة للمعايير: ضع ok: true.
      قيّم الصورة بدرجات تقديرية من 0 إلى 100: cleanlinessScore للنظافة الظاهرة، hygieneScore لمؤشرات الهايجين، وtaskMatch لمدى مطابقة الصورة للمهمة. اكتب findings كمصفوفة قصيرة بالملاحظات. لا تدّعِ رؤية شيء غير واضح في الصورة.
      يجب أن يكون ردك JSON صحيحاً فقط بهذا الشكل: {"ok":true,"reason":"","cleanlinessScore":90,"hygieneScore":90,"taskMatch":true,"findings":[]}. هذه الدرجات تقديرية وليست بديلاً عن مراجعة المدير.` },
      { inlineData: { mimeType: 'image/jpeg', data: photo.split(',')[1] } }
    ]);
    
    const txt = (r.response.text() || '').trim();
    const clean = txt.replace(/```json/g,'').replace(/```/g,'').trim();
    const firstBrace = clean.indexOf('{');
    const lastBrace = clean.lastIndexOf('}');
    if(firstBrace !== -1 && lastBrace !== -1){
      const jsonStr = clean.substring(firstBrace, lastBrace + 1);
      const obj = JSON.parse(jsonStr);
      const score = v => Number.isFinite(Number(v)) ? Math.max(0, Math.min(100, Math.round(Number(v)))) : null;
      return {
        ok: !!obj.ok,
        reason: obj.reason || (obj.ok ? 'الصورة اجتازت الفحص الآلي.' : 'المهمة لم تتطابق مع معايير الهايجين والنظافة المطلوبة.'),
        cleanlinessScore: score(obj.cleanlinessScore),
        hygieneScore: score(obj.hygieneScore),
        taskMatch: obj.taskMatch !== false,
        findings: Array.isArray(obj.findings) ? obj.findings.map(x => String(x)).slice(0, 8) : []
      };
    } else {
      throw new Error('استجابة غير صالحة من النموذج');
    }
  }catch(e){ 
    return { ok: false, reason: 'خطأ في التحليل: ' + (e.message || 'تعذر معالجة الصورة بواسطة البوت الذكي'), cleanlinessScore: 0, hygieneScore: 0, taskMatch: false, findings: ['تعذر تحليل استجابة فحص الصورة'] }; 
  }
}

async function botCheckHygiene(t, photo, tempVal){
  // Run both checks independently: a temperature failure must not skip photo review.
  const photoCheck = await aiCleanCheck(t, photo);
  let tempOk = true;
  let tempReason = '';
  if(tempVal !== null && tempVal !== undefined && !Number.isNaN(Number(tempVal))){
    const temp = Number(tempVal);
    if(t.name.includes('الثلاجات') && temp >= 39){
      tempOk = false;
      tempReason = 'درجة حرارة الثلاجة غير مطابقة: القراءة ' + temp + '°F، والمطلوب أقل من 39°F.';
    }
    if(t.name.includes('الفريزر') && temp > 0){
      tempOk = false;
      tempReason = 'درجة حرارة الفريزر غير مطابقة: القراءة ' + temp + '°F، والمطلوب 0°F أو أقل.';
    }
    if(t.name.includes('قياس درجة حرارة المنتجات') && !(temp < 39 || temp > 140)){
      tempOk = false;
      tempReason = 'درجة حرارة المنتج غير مطابقة: القراءة ' + temp + '°F. المطلوب للمنتج البارد أقل من 39°F أو للمنتج الساخن أعلى من 140°F.';
    }
  }
  const reasons = [];
  if(!photoCheck.ok) reasons.push('فحص الصورة: ' + (photoCheck.reason || 'الصورة غير مطابقة'));
  if(!tempOk) reasons.push('فحص الحرارة: ' + tempReason);
  return {
    ok: !!photoCheck.ok && tempOk,
    photoOk: !!photoCheck.ok,
    photoReason: photoCheck.reason || '',
    cleanlinessScore: photoCheck.cleanlinessScore ?? null,
    hygieneScore: photoCheck.hygieneScore ?? null,
    taskMatch: photoCheck.taskMatch !== false,
    findings: photoCheck.findings || [],
    totalScore: photoCheck.cleanlinessScore != null && photoCheck.hygieneScore != null ? Math.round((photoCheck.cleanlinessScore + photoCheck.hygieneScore) / 2) : null,
    tempOk,
    tempReason,
    reason: reasons.join(' | ') || 'اجتازت الصورة ودرجة الحرارة الفحصين.'
  };
}

async function askBot(){
  const el = document.getElementById('botQ');
  const q = (el.value || '').trim();
  if(!q) return;
  ST.chatMsgs.push({ who:'me', text:q });
  el.value = '';
  
  let ans = '';
  const model = await gemini();
  if(model){
    try{
      const r = await model.generateContent([
        { text: `أنت مساعد ومفتش سلامة وصحة غذاء وهايجين ذكي جداً لمطعم "كنساس فرايد تشيكن". أجب على سؤال الموظف بدقة واختصار شديد باللغة العربية بناءً على معايير سلامة الغذاء ودرجات الحرارة والهايجين في المطعم. سؤال الموظف هو: "${q}"` }
      ]);
      ans = (r.response.text() || '').trim();
    }catch(e){
      ans = 'عذراً، حدث خطأ في الاتصال بالبوت. يرجى مراجعة المرجع الرئيسي.';
    }
  } else {
    ans = 'تنبيه صارم: أي تهاون في الهايجين أو سلامة الغذاء مرفوض تماماً.';
  }

  if(!ans){
    ans = 'يرجى الالتزام التام بمعايير النظافة والهايجين وسلامة الغذاء بمطعم كنساس.';
  }

  ST.chatMsgs.push({ who:'bot', text:ans });
  render();
}

function answerQ(id){
  const v = (document.getElementById('ans_'+id).value || '').trim();
  if(!v){ alert('اكتب الرد'); return; }
  updateDoc(doc(fdb,'questions',id), { answer:v, answered:true, answeredAt:Date.now() })
    .then(()=>loadQuestions())
    .catch(e=>fail('حفظ الرد', e));
}

function isLate(sh){
  const end = new Date(ST.date+'T00:00:00');
  if(sh==='صباحي'){ end.setHours(15,0,0,0); }
  else { end.setDate(end.getDate()+1); end.setHours(6,0,0,0); }
  return Date.now() > end.getTime();
}
function getQ(){ try{ return JSON.parse(localStorage.getItem('kq')||'[]'); }catch(e){ return []; } }
function setQ(q){ try{ localStorage.setItem('kq', JSON.stringify(q)); }catch(e){} }
async function flushQ(){
  const q = getQ();
  if(!q.length || !navigator.onLine || !ST.user) return;
  const keep = [];
  for(const it of q){
    try{ await setDoc(doc(fdb,'done',it.id), it.rec); }catch(e){ keep.push(it); }
  }
  setQ(keep);
}
window.addEventListener('online', flushQ);
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

  revShift:'all', reportDay:todayStr(), report:[], cur:null, photo:null, taken:false, busy:false, authErr:'', showRef:false, showChat:false, chatMsgs:[] };
let TASKS=[], DONE=[], unsubDone=null, camStream=null;

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDate(s){const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;}
function weekday(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-EG',{weekday:'long'});}
const okS = s => s==='approved'||s==='done';
const subS = s => s==='pending' || s==='done' || s==='approved';
function stLabel(s){return ({done:'بانتظار مراجعة المدير',pending:'بانتظار مراجعة المدير',approved:'معتمدة',rejected:'مرفوضة - حرارة غير مطابقة'})[s]||'لسه';}
function stCls(s){return (s==='approved'||s==='done')?'done':(s==='pending'?'review':s==='rejected'?'bad':'');}
function taskList(sh){return TASKS.filter(t=>t.active!==false && t.shift===sh).sort((a,b)=>(a.order||0)-(b.order||0));}
function findTask(id){return TASKS.find(t=>t.id===id);}
function recOf(taskId, sh){return DONE.find(r=>r.taskId===taskId && r.shift===sh);}
function fail(ctx, e){ alert(ctx+' ما اتمش.\nاتأكد من النت، ولو فضلت المشكلة كلم المدير.\n('+((e&&(e.code||e.message))||'')+')'); }

function subTasks(){

onAuthStateChanged(auth, u=>{

async function login(){

  if(!email || !pass){ ST.authErr='اكتب الإيميل والباسورد'; render(); return; }
  try{

    await signInWithEmailAndPassword(auth, email, pass);

  }catch(e){
    ST.authErr = 'الإيميل أو الباسورد غلط، أو الحساب مش موجود. كلم المدير.';

function empView(){
  const list = taskList(ST.shift);
  const apprN = list.filter(t=>okS(recOf(t.id,ST.shift)?.status)).length;
  const resPct = list.length ? Math.round(apprN/list.length*100) : 0;
  const rows = list.map(t=>{
    const r = recOf(t.id, ST.shift);
    const st = r ? r.status : 'todo';
    const tag = r ? `<span class="tag ${stCls(st)}">${stLabel(st)}</span>` : (isLate(ST.shift) ? '<span class="tag review">متأخرة</span>' : '<span class="tag">لسه</span>');
    return `<div class="task" onclick="openTask('${t.id}')">
      <span class="dot ${stCls(st)}"></span>
      <div class="t">
        <div>${esc(t.name)}</div>
        <div class="muted">${esc(t.zone)}</div>
        ${(t.tip||TIPS[t.name])?`<div class="muted" style="color:#2e7d32">💡 ${esc(t.tip||TIPS[t.name])}</div>`:''}
        ${r && r.status==="rejected"?`<div style="color:#c62828;font-weight:bold;margin-top:4px">🌡️ مرفوضة بسبب الحرارة <span style="font-weight:normal;color:var(--muted)">(${esc(r.rejectReason||'درجة الحرارة خارج الحدود')})</span></div>`:''}
      </div>
      ${tag}
    </div>`;
  }).join('') || '<div class="card muted">مفيش مهام لشيفتك دلوقتي. اضغط تحديث، ولو فضلت كده كلم المدير.</div>';
  const myToday = DONE.filter(r=>r.uid===ST.user.uid && r.date===ST.date);
  const myApproved = myToday.filter(r=>r.status==='approved'||r.status==='done').length;
  const myPending = myToday.filter(r=>r.status==='pending').length;
  const myRejected = myToday.filter(r=>r.status==='rejected').length;
  const myScores = myToday.filter(r=>Number.isFinite(Number(r.totalScore))).map(r=>Number(r.totalScore));
  const myAvg = myScores.length ? Math.round(myScores.reduce((a,b)=>a+b,0)/myScores.length) : 0;
  const dailyPct = list.length ? Math.round(myApproved/list.length*100) : 0;
  return `
  <div class="top"><div><h1>شيفت ${esc(ST.shift)}</h1><div class="employee-identity"><span class="shift-label">${esc(ST.shift)} · ${weekday(ST.date)} ${fmtDate(ST.date)}</span><span class="employee-name">👤 ${esc(ST.name)}</span></div></div>
    <div><button class="sec small" onclick="ST.showRef=true;render()">📘 المرجع</button><button class="sec small" onclick="ST.showChat=true;render()">🤖 المساعد</button><button class="sec small" onclick="refreshAll()">🔄 تحديث</button><button class="sec small" onclick="logout()">🚪 خروج</button></div></div>
  <div class="daily-eval">
    <div class="daily-eval-head"><div class="daily-eval-title">📊 لوحة تقييمك اليومية</div><span class="tag ${myRejected?'bad':myPending?'review':'done'}">${myRejected?'توجد مهمة حرارة مرفوضة':myPending?'بانتظار مراجعة المدير':'تقييم اليوم'}</span></div>
    <div class="daily-eval-grid">
      <div class="daily-eval-item"><strong>${myApproved}</strong><span>مهام معتمدة</span></div>
      <div class="daily-eval-item"><strong>${myPending}</strong><span>بانتظار المدير</span></div>
      <div class="daily-eval-item"><strong>${myRejected}</strong><span>مرفوضة للحرارة</span></div>
      <div class="daily-eval-item"><strong>${myScores.length?myAvg+'%':'—'}</strong><span>متوسط تحليل البوت</span></div>
    </div>
    <div class="bar"><div style="width:${dailyPct}%"></div></div>
    <div class="muted" style="margin-top:7px">إنجاز المهام المعتمدة اليوم: <b>${dailyPct}%</b> · التحليل الآلي استرشادي، والاعتماد النهائي للمدير.</div>
  </div>
  <div class="card">
    <div>رصيد الاعتماد (النقاط): <b>${apprN}</b> من ${list.length} مهام معتمدة</div>
    <div class="bar"><div style="width:${resPct}%"></div></div>
    <div style="margin-top:10px">نسبة إنجاز المهام المعتمدة: <b>${resPct}%</b>${resPct ? " · " + grade(resPct) : ""}</div>
    <div class="muted">المهام المرفوضة (Not Done 👎🏻) تتيح لك إعادة المحاولة بالدخول عليها وتصحيح التنفيذ والتصوير مجدداً.</div>
  </div>
  ${rows}
  <p class="muted" style="text-align:center">التزامك بالهايجين وسلامة الغذاء شرط أساسي لاعتماد المهام.</p>`;
}
function openTask(id){
  const r = recOf(id, ST.shift);

  ST.cur = id; ST.photo = null; ST.taken = false; render(); startCam();
}

  <h2>إنجاز مهمة: ${esc(t.name)}</h2>
  <div class="card">
    ${isTempTask ? `<label>درجة الحرارة المسجلة (°F):</label><input id="tempVal" type="number" step="0.1" placeholder="مثال: 36 أو -5" style="margin-bottom:10px">` : ''}

    <div class="meta">التاريخ: ${fmtDate(ST.date)} · الوقت: ${new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}<br>تنبيه: البوت الذكي يحلل الصورة والحرارة؛ مخالفة الحرارة ترفض المهمة، وباقي النتائج تنتظر مراجعة المدير.</div>
  </div>
  <button id="capBtn" onclick="capture()">التقاط صورة</button>
  <button id="startBtn" class="sec" onclick="startCam()">فتح الكاميرا من جديد</button>
  <button id="retakeBtn" class="sec" style="display:none" onclick="retake()">إعادة المحاولة (تصوير جديد)</button>
  <button id="sendBtn" style="display:none" onclick="submitPhoto()">إرسال للتحليل الذكي</button>`;
}
async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = document.getElementById('cam');
    if(v){ v.srcObject = camStream; v.style.display='block'; document.getElementById('ph').style.display='none'; }
  }catch(e){
    const ph = document.getElementById('ph');
    if(ph) ph.innerHTML = 'الكاميرا ما فتحتش ('+(e.name||'خطأ')+').<br>اسمح بالكاميرا للمتصفح من إعدادات الموقع، واضغط "فتح الكاميرا من جديد".';
  }
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
function capture(){
  const v = document.getElementById('cam');
  if(!(v && v.srcObject && v.videoWidth)){ alert('الكاميرا مش مفتوحة. اضغط "فتح الكاميرا من جديد" الأول.'); return; }
  const w = 640, h = Math.round(640*v.videoHeight/v.videoWidth);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  ST.photo = c.toDataURL('image/jpeg',0.5); ST.taken = true;
  stopCam();
  v.style.display='none';
  const img = document.getElementById('shot'); img.src = ST.photo; img.style.display='block';
  document.getElementById('ph').style.display='none';
  document.getElementById('capBtn').style.display='none';
  document.getElementById('startBtn').style.display='none';
  document.getElementById('retakeBtn').style.display='block';
  document.getElementById('sendBtn').style.display='block';
}
function retake(){ ST.photo=null; ST.taken=false; render(); startCam(); }
function closeTask(){ stopCam(); ST.cur=null; ST.busy=false; render(); }

async function submitPhoto(){
  if(ST.busy || !ST.taken) return;
  const t = findTask(ST.cur);
  const isTempTask = t.name.includes('حرارة') || t.name.includes('الثلاجات') || t.name.includes('المنتجات');
  let tempVal = null;
  if(isTempTask){
    const tempInput = document.getElementById('tempVal');
    tempVal = tempInput ? parseFloat(tempInput.value) : NaN;
    if(isNaN(tempVal)){ alert('يرجى إدخال قيمة رقمية صحيحة لدرجة الحرارة قبل الإرسال.'); return; }
  }

  ST.busy = true;
  const sendBtn = document.getElementById('sendBtn');
  if(sendBtn){ sendBtn.disabled = true; sendBtn.innerText = '🔍 البوت الذكي يحلل المهمة الآن...'; }
  
  const check = await botCheckHygiene(t, ST.photo, tempVal);
  const now = new Date();
  const id = ST.date+'_'+SK[ST.shift]+'_'+t.id+'_'+ST.user.uid.slice(0,6);

  if(isTempTask && check.tempOk === false){
    const rejectedRec = {
      date: ST.date, ym: ST.date.slice(0,7),
      year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
      shift: ST.shift, taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
      time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
      photo: ST.photo, status: 'rejected', rejectReason: check.tempReason || 'درجة الحرارة خارج الحدود المحددة للمهمة', tempVal: tempVal,
      photoCheckOk: !!check.photoOk, photoCheckReason: check.photoReason || '', tempCheckOk: !!check.tempOk, tempCheckReason: check.tempReason || '',
      cleanlinessScore: check.cleanlinessScore, hygieneScore: check.hygieneScore, totalScore: check.totalScore, taskMatch: check.taskMatch, findings: check.findings || [],
      correctiveAction: 'إعادة تنفيذ المهمة بعد تصحيح الملاحظة ثم إعادة التصوير', reinspectionRequired: true,
      aiNote: 'تم فحص الصورة ودرجة الحرارة كلٌ على حدة؛ الدرجات الآلية تقديرية والمراجعة النهائية للمدير.'
    };
    try{
      await setDoc(doc(fdb,'done',id), rejectedRec);
    }catch(e){
      const q = getQ(); q.push({id, rec: rejectedRec}); setQ(q);
    }

    ST.busy = false;
    closeTask();
    alert('🌡️ تم رفض المهمة بسبب درجة الحرارة.\nالقراءة المسجلة: ' + tempVal + '°F\nالحد المطلوب: ' + (check.tempReason || 'راجع حد الحرارة المكتوب في قالب المهمة') + '\n\nراجع القراءة وصحّحها ثم أعد المحاولة.');
    return;
  }

  const rec = {
    date: ST.date, ym: ST.date.slice(0,7),
    year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
    shift: ST.shift, taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
    time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
    photo: ST.photo, status: 'pending', tempVal: tempVal, photoCheckOk: !!check.photoOk, photoCheckReason: check.photoReason || '', tempCheckOk: !!check.tempOk, tempCheckReason: check.tempReason || '',
    cleanlinessScore: check.cleanlinessScore, hygieneScore: check.hygieneScore, totalScore: check.totalScore, taskMatch: check.taskMatch, findings: check.findings || [], reinspectionRequired: false,
    aiWarning: check.photoOk ? '' : (check.photoReason || check.reason || 'توجد ملاحظات في تحليل الصورة'),
    aiNote: 'حلل البوت الصورة ودرجة الحرارة. الحالة بانتظار مراجعة المدير؛ التحليل الآلي للصورة استرشادي ولا يرفض المهمة تلقائياً.'
  };
  try{
    await setDoc(doc(fdb,'done',id), rec);
    ST.busy = false; closeTask();
  }catch(e){
    ST.busy = false; 
    if(sendBtn){ sendBtn.disabled = false; sendBtn.innerText = 'Done 👍🏻'; }
    const q = getQ(); q.push({id, rec}); setQ(q);
    closeTask();
    alert('النت مش شغال. المهمة اتحفظت على الموبايل وهتتبعت أوتوماتيك لما النت يرجع.');
  }
}

function mgrView(){
  const tabs = [['rev','المراجعة'],['tasks','المهام'],['qs','الأسئلة'],['rep','التقرير']]
    .map(([k,l])=>`<button class="tab ${ST.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  const body = ST.tab==='rev' ? revView() : ST.tab==='tasks' ? tasksView() : ST.tab==='qs' ? questionsView() : repView();
  const todayRecords = DONE;
  const approvedCount = todayRecords.filter(r=>r.status==='approved').length;
  const rejectedCount = todayRecords.filter(r=>r.status==='rejected').length;
  const pendingCount = todayRecords.filter(r=>r.status==='pending').length;
  return `
  <div class="top"><div><h1>لوحة المدير</h1><div class="muted">${esc(ST.user.email)} · KANSAS CHICKEN</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <button class="sec small" onclick="ST.showRef=true;render()">المرجع</button>
      <button class="sec small" onclick="ST.showChat=true;render()">المساعد</button>
      <button class="sec small" onclick="refreshAll()">تحديث</button>
      <button class="sec small" onclick="logout()">خروج</button>
    </div></div>
  <div class="card"><h2>ملخص الشيفت المحدد</h2><div class="ops-kpis"><div><strong>${approvedCount}</strong><span>منفذة / معتمدة</span></div><div><strong>${pendingCount}</strong><span>بانتظار المراجعة</span></div><div><strong>${rejectedCount}</strong><span>مرفوضة وتحتاج تصحيح</span></div></div></div>
  <div class="tabs">${tabs}</div>${body}`;
}
function setTab(k){ ST.tab=k; if(k==='rep') loadReport(); if(k==='qs') loadQuestions(); render(); }

function revView(){
  const recs = DONE.filter(r=>ST.revShift==='all' || r.shift===ST.revShift);
  const rejectedRecs = recs.filter(r=>r.status==='rejected');
  const repeatCounts = {};
  (ST.report||[]).filter(r=>r.status==='rejected').forEach(r=>{
    const k=(r.employee||'?')+'|'+(r.taskName||'?');
    repeatCounts[k]=(repeatCounts[k]||0)+1;
  });
  const shifts = ST.revShift==='all' ? SHIFTS : [ST.revShift];
  const missing = shifts.flatMap(sh => taskList(sh).filter(t=>!recOf(t.id,sh)).map(t=>({sh,t})));
  
  const alertHtml = rejectedRecs.length ? `
    <div class="badbox">
      <b>⚠️ تنبيه خطأ تشغيلي (${rejectedRecs.length} مهام مرفوضة أوتوماتيكياً):</b>
      <ul style="margin:4px 0 0;padding-right:16px">
        ${rejectedRecs.map(r=>`<li style="font-size:13px">${esc(r.employee)} - ${esc(r.taskName)} (${esc(r.shift)}): ${esc(r.rejectReason||'مخالفة هايجين')}</li>`).join('')}
      </ul>
    </div>` : '';

  const cards = recs.map(r=>`
    <div class="card" style="${r.status==='rejected'?'border-color:var(--bad)':''}">
      <div class="row"><b>${esc(r.taskName)}</b><span class="tag ${stCls(r.status)}">${stLabel(r.status)}</span></div>
      ${r.status==='rejected'&&(repeatCounts[(r.employee||'?')+'|'+(r.taskName||'?')]||0)>=2?`<div class="badbox" style="margin-top:8px;margin-bottom:0"><b>مخالفة متكررة:</b> تم تسجيل رفض هذه المهمة ${repeatCounts[(r.employee||'?')+'|'+(r.taskName||'?')]} مرات خلال الشهر المحدد.</div>`:''}
      <div class="muted">${esc(r.zone)} · ${esc(r.shift)} · ${esc(r.employee)} · ${esc(r.time)} ${r.tempVal!==null&&r.tempVal!==undefined?`· حرارة: <b>${r.tempVal}°F</b>`:''}</div>
      ${(r.cleanlinessScore!=null||r.hygieneScore!=null||r.totalScore!=null)?`<div class="score-strip"><span>النظافة: <b>${r.cleanlinessScore??'—'}/100</b></span><span>الهايجين: <b>${r.hygieneScore??'—'}/100</b></span><span>الإجمالي: <b>${r.totalScore??'—'}/100</b></span></div>`:''}
      ${r.aiWarning?`<div class="warnbox" style="margin-top:8px;margin-bottom:8px"><b>ملاحظة البوت:</b> ${esc(r.aiWarning)}</div>`:''}
      ${(Array.isArray(r.findings)&&r.findings.length)?`<div class="meta"><b>ملاحظات التحليل:</b> ${r.findings.map(x=>esc(x)).join(' · ')}</div>`:''}
      ${r.status==='rejected'?`<div style="color:#c62828;font-weight:bold;margin-top:4px">Not Done 👎🏻 <span style="font-weight:normal;color:var(--muted)">(${esc(r.rejectReason||'')})</span></div>${r.correctiveAction?`<div class="warnbox" style="margin-top:8px;margin-bottom:0"><b>الإجراء التصحيحي:</b> ${esc(r.correctiveAction)} ${r.reinspectionRequired?' · مطلوب إعادة الفحص':''}</div>`:''}`:''}
      ${r.photo ? `<img class="shot" src="${r.photo}" alt="">` : '<div class="muted" style="margin-top:6px">بدون صورة</div>'}
      <div class="btns">
        <button onclick="setStatus('${r.id}','approved')">اعتماد</button>
        <button class="sec danger" onclick="rejectRec('${r.id}')">رفض يدوياً (Not Done 👎🏻)</button>
        <button class="sec danger" onclick="removeRec('${r.id}')">حذف</button>
      </div>
    </div>`).join('') || '<div class="card muted">ما فيش تنفيذ مسجل في التاريخ ده.</div>';
  const miss = missing.map(x=>`<div class="muted" style="padding:4px 0">• ${esc(x.t.name)} (${esc(x.sh)})${isLate(x.sh)?' · <b style="color:#c62828">متأخرة</b>':''}</div>`).join('') || '<div class="muted">كل المهام اتنفذت ✓</div>';
  return `
  ${alertHtml}
  <div class="card">
    <label>التاريخ</label><input type="date" value="${ST.date}" onchange="setDate(this.value)">
    <label>الشيفت</label>
    <select onchange="ST.revShift=this.value;render()">
      <option value="all" ${ST.revShift==='all'?'selected':''}>الاتنين</option>
      ${SHIFTS.map(s=>`<option ${ST.revShift===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <div style="margin-top:10px">${recs.length} منفذة · ${missing.length} ناقصة</div>
  </div>
  <div class="card"><b>لم تُنفّذ</b>${miss}</div>
  ${cards}`;
}
function setDate(v){ ST.date=v; subDone(); render(); }
function setStatus(id,status){
  updateDoc(doc(fdb,'done',id), {status, reviewedBy:'المدير', reviewedAt:new Date().toISOString()}).catch(e=>fail('الاعتماد', e));
}
function rejectRec(id){
  const why = prompt('اكتب سبب الرفض (Not Done 👎🏻):', 'مخالفة معايير الهايجين والنظافة، يرجى إعادة المحاولة.');
  if(!why) return;
  const action = prompt('اكتب الإجراء التصحيحي المطلوب قبل إعادة الفحص:', 'تصحيح الملاحظة، تنظيف المنطقة، ثم إعادة تنفيذ المهمة وتصويرها.');
  if(action === null) return;
  updateDoc(doc(fdb,'done',id), {status:'rejected', rejectReason: why.trim(), correctiveAction: action.trim(), reinspectionRequired:true, reviewedBy:'المدير', reviewedAt:new Date().toISOString()}).catch(e=>fail('الرفض', e));
}
function removeRec(id){ if(confirm('تحذف التسجيل ده؟')) deleteDoc(doc(fdb,'done',id)).catch(e=>fail('الحذف', e)); }

function tasksView(){
  if(!TASKS.length) return `<div class="card"><p class="muted">مفيش مهام لسه.</p><button onclick="importDefaults()">استيراد المهام الافتراضية</button></div>`;
  const lists = SHIFTS.map(sh=>{
    const items = TASKS.filter(t=>t.shift===sh).sort((a,b)=>(a.order||0)-(b.order||0)).map(t=>`
      <div class="task" style="cursor:default;${t.active===false?'opacity:.5':''}">
        <div class="t">${esc(t.name)}<div class="muted">${esc(t.zone)}</div></div>
        <button class="sec small" onclick="editTip('${t.id}')">نصيحة</button>
        <button class="sec small" onclick="toggleTask('${t.id}',${t.active!==false})">${t.active===false?'تفعيل':'إيقاف'}</button>
        <button class="sec small danger" onclick="delTask('${t.id}')">حذف</button>
      </div>`).join('');
    return `<div class="card"><b>شيفت ${sh}</b>${items||'<div class="muted">لا توجد مهام</div>'}</div>`;
  }).join('');
  return `
  <div class="card"><h2>إضافة مهمة</h2>
    <label>اسم المهمة</label><input id="nt_name">
    <label>المنطقة</label><input id="nt_zone">
    <label>الشيفت</label><select id="nt_shift"><option>صباحي</option><option>مسائي</option></select>
    <button onclick="addTask()">إضافة</button></div>
  ${lists}`;
}
function addTask(){
  const name = document.getElementById('nt_name').value.trim();
  const zone = document.getElementById('nt_zone').value.trim() || 'عام';
  const shift = document.getElementById('nt_shift').value;
  if(!name){ alert('اكتب اسم المهمة'); return; }
  addDoc(collection(fdb,'tasks'), {name, zone, shift, order: Date.now(), active:true}).catch(e=>fail('إضافة المهمة', e));
}
function editTip(id){
  const t = findTask(id);
  const cur = t.tip || TIPS[t.name] || '';
  const v = prompt('اكتب النصيحة للمهمة (هتظهر للموظف):', cur);
  if(v === null) return;
  updateDoc(doc(fdb,'tasks',id), {tip: v.trim()}).catch(e=>fail('حفظ النصيحة', e));
}
function toggleTask(id, active){ updateDoc(doc(fdb,'tasks',id), {active:!active}).catch(e=>fail('التعديل', e)); }
function delTask(id){ if(confirm('تحذف المهام من القايمة؟')) deleteDoc(doc(fdb,'tasks',id)).catch(e=>fail('الحذف', e)); }
function importDefaults(){
  Promise.all(DEFAULT_TASKS.map(([shift,zone,name],i)=>addDoc(collection(fdb,'tasks'), {name, zone, shift, order:i+1, active:true})))
    .catch(e=>fail('الاستيراد', e));
}

function grade(p){ return p>=95?'ممتاز':p>=90?'جيد جداً':p>=85?'ناجح':'راسب'; }
function repView(){
  const [y,m] = ST.month.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const tot = {'صباحي': taskList('صباحي').length, 'مسائي': taskList('مسائي').length};
  const all = tot['صباحي'] + tot['مسائي'];
  let rows = '', passDays = 0, workDays = 0, sumPct = 0;
  for(let d=1; d<=days; d++){
    const date = ST.month+'-'+String(d).padStart(2,'0');
    const cnt = sh => ST.report.filter(r=>r.date===date && r.shift===sh && okS(r.status)).length;
    const a = cnt('صباحي'), b = cnt('مسائي');
    const pct = all ? Math.round((a+b)/all*100) : 0;
    const any = ST.report.some(r=>r.date===date);
    if(any){ workDays++; sumPct += pct; if(pct>=85) passDays++; }
    rows += `<tr><td>${d}</td><td>${a}/${tot['صباحي']}</td><td>${b}/${tot['مسائي']}</td><td>${any?pct+'%':'-'}</td><td>${any?grade(pct):'-'}</td></tr>`;
  }
  const avg = workDays ? Math.round(sumPct/workDays) : 0;
  const emps = {};
  ST.report.forEach(r=>{ const k=r.employee||'?'; emps[k]=emps[k]||{sub:0,ok:0,rej:0}; emps[k].sub++; if(okS(r.status)) emps[k].ok++; if(r.status==='rejected') emps[k].rej++; });
  const empRows = Object.keys(emps).sort().map(k=>{
    const e = emps[k]; const p = e.sub ? Math.round(e.ok/e.sub*100) : 0;
    return `<tr><td>${esc(k)}</td><td>${e.sub}</td><td>${e.ok}</td><td>${e.rej}</td><td>${p}%</td><td>${grade(p)}</td></tr>`;
  }).join('') || '<tr><td colspan="6">ما فيش تسجيلات</td></tr>';

  const dayRecs = ST.report.filter(r=>r.date===ST.reportDay);
  const groups = {};
  dayRecs.forEach(r=>{ const k=(r.employee||'?')+'|'+r.shift; (groups[k]=groups[k]||{name:r.employee||'?', shift:r.shift, list:[]}).list.push(r); });
  const groupHtml = Object.values(groups).sort((a,b)=>a.shift>b.shift?1:-1).map(g=>{
    const total = taskList(g.shift).length;
    const ok = g.list.filter(r=>okS(r.status)).length;
    const p = total ? Math.round(ok/total*100) : 0;
    const items = g.list.slice().sort((a,b)=>(a.time>b.time?1:-1)).map(r=>`<div class="rec">
        <div><b>${esc(r.taskName)}</b> · ${esc(r.zone)} · ${esc(r.time)} · ${stLabel(r.status)} ${r.tempVal!==null&&r.tempVal!==undefined?`· حرارة: <b>${r.tempVal}°F</b>`:''}</div>
        ${r.status==='rejected' ? `<div style="color:#c62828;font-weight:bold;margin-top:4px">Not Done 👎🏻 <span style="font-weight:normal;color:var(--muted)">(${esc(r.rejectReason||'')})</span></div>` : ''}
        ${r.photo ? `<img src="${r.photo}" alt="">` : '<div class="muted">بدون صورة</div>'}
      </div>`).join('');
    return `<div class="card emp-block"><b>${esc(g.name)}</b> · شيفت ${esc(g.shift)}<br>
      النتيجة: <b>${p}%</b> (${grade(p)}) · معتمد ${ok} من ${total}
      ${items}</div>`;
  }).join('') || '<div class="card muted">ما فيش تنفيذ في اليوم ده.</div>';
  const dayMissing = SHIFTS.flatMap(sh => taskList(sh).filter(t=>!dayRecs.some(r=>r.taskId===t.id && r.shift===sh)).map(t=>({sh,t})));
  const missHtml = dayMissing.map(x=>`<div class="muted">• ${esc(x.t.name)} (${esc(x.sh)})</div>`).join('') || '<div class="muted">كل المهام اتنفذت ✓</div>';

  return `
  <div class="card">
    <label>الشهر</label><input type="month" value="${ST.month}" onchange="setMonth(this.value)">
    <label>اليوم (للتقرير اليومي)</label><input type="date" value="${ST.reportDay}" onchange="setReportDay(this.value)">
    <button onclick="window.print()">تحميل PDF (تقرير اليوم)</button>
    <div class="muted" style="margin-top:6px">في نافذة الطباعة اختار <b>Save as PDF</b>.</div>
  </div>
  <div class="card" style="overflow-x:auto"><b>الملخص الشهري</b>
    <div style="margin:6px 0">أيام فيها تسجيل: ${workDays} · أيام ناجحة: ${passDays} · متوسط: ${avg}% · ${workDays?grade(avg):'-'}</div>
    <table><tr><th>اليوم</th><th>صباحي</th><th>مسائي</th><th>النسبة</th><th>التقدير</th></tr>{rows}</table></div>
  <div class="card" style="overflow-x:auto"><b>تقييم الموظفين للشهر</b>
    <table><tr><th>الموظف</th><th>تسجيلات</th><th>معتمدة</th><th>مرفوضة</th><th>نسبة الاعتماد</th><th>التقدير</th></tr>{empRows}</table></div>
  <div id="printArea">
    <h2 style="text-align:center">تقرير يوم ${fmtDate(ST.reportDay)} · KANSAS CHICKEN</h2>
    ${groupHtml}
    <div class="card"><b>لم تُنفّذ في اليوم ده</b>{missHtml}</div>
  </div>`;
}
function setReportDay(v){ ST.reportDay=v; if(v.slice(0,7)!==ST.month){ ST.month=v.slice(0,7); loadReport(); } render(); }
function setMonth(v){ ST.month=v; loadReport(); }
function loadReport(){
  getDocs(query(collection(fdb,'done'), where('ym','==',ST.month)))
    .then(s=>{ ST.report = s.docs.map(d=>d.data()); render(); })
    .catch(e=>console.warn(e));
}

setTimeout(()=>{ ST.splashDone=true; render(); }, 1800);
Object.assign(window, { ST, render, login, logout, openTask, closeTask, startCam, capture, retake, submitPhoto, refreshAll,
  setTab, setDate, setStatus, rejectRec, removeRec, addTask, editTip, toggleTask, delTask, importDefaults, setMonth, setReportDay, askBot, answerQ, loadQuestions });
</script>
</body>
