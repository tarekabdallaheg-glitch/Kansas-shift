function withTimeout(p, ms){
  return Promise.race([p, new Promise((_, rej)=>setTimeout(()=>rej(new Error('انتهى وقت الانتظار')), ms))]);
}

function imageBrightness(photo){
  return new Promise(res=>{
    if(!photo) return res(0);
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = 64; c.height = Math.max(1, Math.round(64*img.height/img.width));
      const x = c.getContext('2d');
      x.drawImage(img, 0, 0, c.width, c.height);
      const d = x.getImageData(0, 0, c.width, c.height).data;
      let sum = 0, n = 0;
      for(let i=0; i<d.length; i+=4){ sum += (d[i]+d[i+1]+d[i+2])/3; n++; }
      res(n ? sum/n : 0);
    };
    img.onerror = ()=>res(0);
    img.src = photo;
  });
}

function isHygieneTask(t){

    || z.includes('الهايجين') || z.includes('سلامة');
}

let AIMOD = null;
async function geminiGen(parts){
  if(!AIMOD){
    try{
      const m = await import('https://www.gstatic.com/firebasejs/13.1.0/firebase-ai.js');
      AIMOD = { m, ai: m.getAI(app, { backend: new m.GoogleAIBackend() }) };
    }catch(e){ throw new Error('AI Logic غير مفعّل: ' + (e.message || e)); }
  }
  let lastErr = null;
  for(const name of ['gemini-2.5-flash-lite','gemini-2.5-flash','gemini-2.0-flash']){
    try{
      const model = AIMOD.m.getGenerativeModel(AIMOD.ai, { model: name });
      return await withTimeout(model.generateContent(parts), 25000);
    }catch(e){ lastErr = e; }
  }
  throw new Error(lastErr ? (lastErr.message || String(lastErr)) : 'فشل غير معروف');
}

async function aiCleanCheck(t, photo){
  if(!photo) return { verdict:'unsure', reason:'مفيش صورة' };
  const strict = isHygieneTask(t);
  const rule = strict
    ? 'أنت مفتش صارم جداً في الهايجين وسلامة الغذاء. قول fail لو الصورة مش واضحة تثبت المطلوب بالظبط (غسل الإيدين، الزي، غطاء الشعر، نظافة الأدوات والمنتجات). لو الصورة معتمة أو مش واضحة قول unsure, ولو مش متأكد قول unsure.'
    : 'أنت مفتش نظافة معقول. قول fail بس لو فيه اتساخ واضح أو إهمال ظاهر. التفاصيل الصغيرة والإضاءة العادية ما تترفضش. لو الصورة معتمة أو مش واضحة قول unsure, ولو مش متأكد قول unsure.';
  try{
    const r = await geminiGen([
      { text: 'المهمة: "' + t.name + '" في منطقة "' + t.zone + '". لو الصورة مش مطابقة للمهمة بوضوح (زي صورة حيطة مكان الزيت، أو مكان تاني خالص) قول fail. ' + rule + ' رد بـ JSON فقط بدون أي كلام تاني، بالشكل: {"verdict":"pass" أو "fail" أو "unsure","reason":"سبب قصير بالعربي"}' },
      { inlineData: { mimeType:'image/jpeg', data: photo.split(',')[1] } }
    ]);
    const txt = (r.response.text() || '').replace(/```json/gi,'').replace(/```/g,'');
    const x = txt.indexOf('{'), y = txt.lastIndexOf('}');
    let v = 'unsure', reason = '';
    try{
      const obj = JSON.parse(txt.substring(x, y+1));
      const raw = String(obj.verdict || '').toLowerCase();
      reason = obj.reason || '';
      if(raw.includes('unsure') || raw.includes('غير متأكد')) v = 'unsure';
      else if(raw.includes('fail') || raw.includes('مرفوض') || raw.includes('غير مطابق')) v = 'fail';
      else if(raw.includes('pass') || raw.includes('مطابق')) v = 'pass';
    }catch(e){
      const low = txt.toLowerCase();
      if(low.includes('"unsure"')) v = 'unsure';
      else if(low.includes('"fail"') || low.includes('مرفوض')) v = 'fail';
      else if(low.includes('"pass"')) v = 'pass';
      reason = 'رد غير مفهوم من جيمي: ' + txt.slice(0, 80);
    }
    return { verdict: v, reason: reason };
  }catch(e){
    return { verdict:'unsure', reason:'Gemini ما ردش: ' + ((e && e.message) || 'خطأ') };
  }
}

function tempCheck(t, tempVal){
  if(tempVal === null || tempVal === undefined || isNaN(tempVal)) return null;
  const n = t.name || '';
  const isFridge = n.includes('فحص الثلاجات') || n.includes('الثلاجة');
  const isCold = n.includes('الباردة');
  const isHot = n.includes('الساخنة') || n.includes('الهولدنج');
  if(n.includes('الفريزر') && tempVal > 0) return 'درجة الفريزر (' + tempVal + '°F) أعلى من 0°F.';
  if(isFridge && tempVal >= 39) return 'درجة الثلاجة (' + tempVal + '°F) أعلى من الحد (أقل من 39°F).';
  if(isCold && isHot && tempVal >= 39 && tempVal <= 140) return 'الحرارة (' + tempVal + '°F) في منطقة الخطر (الباردة أقل من 39°F، والساخنة أعلى من 140°F).';
  if(isCold && !isHot && tempVal >= 39) return 'المنتج البارد (' + tempVal + '°F) أعلى من 39°F.';
  if(isHot && !isCold && tempVal < 140) return 'المنتج الساخن (' + tempVal + '°F) أقل من 140°F.';
  return null;
}

async function botCheckHygiene(t, photo, tempVal){
  const hygiene = isHygieneTask(t);
  const tRes = tempCheck(t, tempVal);
  if(tRes) return { status:'rejected', violation:true, reason:'البوت: ' + tRes };
  const isTempOnly = /الثلاجة|فحص الثلاجات|الفريزر|الباردة|الساخنة|الهولدنج/.test(t.name || '');
  if(isTempOnly && tempVal !== null && tempVal !== undefined && !isNaN(tempVal)){
    const bright0 = await imageBrightness(photo);
    if(bright0 < 45) return { status:'pending', violation:false, reason:'الصورة معتمة أو مش واضحة، المدير يراجعها' };
    return { status:'done', violation:false, reason:'البوت: الحرارة (' + tempVal + '°F) مطابقة للحد' };
  }
  const bright = await imageBrightness(photo);
  if(bright < 45) return { status:'pending', violation:false, reason:'الصورة معتمة أو مش واضحة (سطوع ' + Math.round(bright) + ' من 255)، المدير يراجعها' };
  const ai = await aiCleanCheck(t, photo);
  if(ai.verdict === 'fail' && hygiene) return { status:'rejected', violation:true, reason:'جيمي: ' + (ai.reason || 'الهايجين أو سلامة الغذاء غير مطابقة') };
  if(ai.verdict === 'fail') return { status:'pending', violation:false, reason:'جيمي شاف احتمال اتساخ، المدير يراجع: ' + (ai.reason || '') };
  if(ai.verdict === 'unsure') return { status:'pending', violation:false, reason:'جيمي مش متأكد، المدير يراجع: ' + (ai.reason || '') };
  return { status:'done', violation:false, reason:'البوت وجيمي اتفقوا إن المهمة مطابقة' };
}

function localAnswer(q){
  const x = (q||'').toLowerCase();
  const has = arr => arr.some(w => x.includes(w));
  if(has(['فريزر','تجميد'])) return 'الفريزر لازم يكون 0°F أو أقل.';
  if(has(['ثلاج','تبريد','حرار','هولدنج','ساخن','بارد'])) return 'الثلاجة لازم تكون أقل من 39°F، والهولدنج الساخن أعلى من 140°F. لو الرقم مخالف، المهمة بتترفض وتتسجل مخالفة، وبلّغ المدير.';
  if(has(['دجاج','فراخ'])) return 'الدجاج لازم يوصل داخلياً لـ 165°F على الأقل.';
  if(has(['زيت','مقلاة'])) return 'صفّي الزيت يومياً بعد ما يبرد، وافحص لونه وريحته، ولو داكن أو ريحته وحشة بلّغ المدير.';
  if(has(['حشر','فار','قوارض'])) return 'بلّغ المدير فوراً، ومتحاولش تتعامل معاها لوحدك.';
  if(has(['إيد','ايد','غسل','هايجين','زي','شعر'])) return 'اغسل إيدك قبل البدء، وبعد الحمام، وبعد لمس الموبايل. الزي النظيف وغطاء الشعر إلزاميين.';
  if(has(['تنظيف','تعقيم','معقم','نضاف'])) return 'نضّف الأول، بعدين اشطف، بعدين عقّم بمعقم معتمد للأغذية، وسيبه الوقت المكتوب على العبوة.';
  if(has(['شيفت','مهام','متبقي','ناقص','باقي'])){
    const sh = ST.shift;
    const left = taskList(sh).filter(t=>!subS(recOf(t.id,sh)?.status));
    return left.length ? 'باقي عليك ' + left.length + ' مهام في شيفت ' + sh + ': ' + left.slice(0,5).map(t=>t.name).join('، ') : 'كل مهام شيفت ' + sh + ' اتنفذت ✓';
  }
  return '';
}

async function askBot(){
  const el = document.getElementById('botQ');
  const q = (el.value || '').trim();
  if(!q) return;
  ST.chatMsgs.push({ who:'me', text:q });
  el.value = '';
  
  let ans = localAnswer(q);
  const model = ans ? null : await gemini();
  if(model){
    try{
      const r = await model.generateContent([
        { text: `أنت مساعد ومفتش سلامة وصحة غذاء وهايجين ذكي جداً لمطعم "كنساس فرايد تشيكن". أجب على سؤال الموظف بدقة واختصار شديد باللغة العربية بناءً على معايير سلامة الغذاء ودرجات الحرارة والهايجين في المطعم. سؤال الموظف هو: "${q}"` }
      ]);
      ans = (r.response.text() || '').trim();
    }catch(e){
      ans = 'عذراً، حدث خطأ في الاتصال بالبوت. يرجى مراجعة المرجع الرئيسي.';
    }
  } else if(!ans) {
    ans = 'تنبيه صارم: أي تهاون في الهايجين أو سلامة الغذاء مرفوض تماماً.';
  }

  if(!ans){
    ans = 'يرجى الالتزام التام بمعايير النظافة والهايجين وسلامة الغذاء بمطعم كنساس.';
  }

  ST.chatMsgs.push({ who:'bot', text:ans });
  render();

  try {
    await addDoc(collection(fdb, 'questions'), {
      text: q,
      employee: ST.name || 'موظف',
      shift: ST.shift || 'عام',
      date: ST.date || todayStr(),
      created: Date.now(),
      answered: false,
      answer: ''
    });
  } catch(err) {
    console.warn('تعذر حفظ السؤال:', err);
  }
}

let QS = [];
function loadQuestions(){
  getDocs(collection(fdb,'questions'))
    .then(s=>{ QS = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.created-a.created); render(); })
    .catch(e=>console.warn(e));
}

function questionsView(){
  const cards = QS.map(q => `
    <div class="card">
      <b>${esc(q.text)}</b>
      <div class="muted">${esc(q.employee)} · ${esc(q.shift)} · ${esc(q.date)}</div>
      ${q.answered ? `<div style="color:#2e7d32;margin-top:6px">ردّك: ${esc(q.answer)}</div>` : `
        <input id="ans_${q.id}" placeholder="اكتب الرد">
        <button onclick="answerQ('${q.id}')">حفظ الرد</button>`}
    </div>`).join('') || '<div class="card muted">ما فيش أسئلة لسه.</div>';
  return `<div class="card"><button class="sec small" onclick="loadQuestions()">تحديث الأسئلة</button></div>${cards}`;
}

function answerQ(id){
  const v = (document.getElementById('ans_'+id).value || '').trim();
  if(!v){ alert('اكتب الرد'); return; }
  updateDoc(doc(fdb,'questions',id), { answer:v, answered:true, answeredAt:Date.now() })
    .then(()=>loadQuestions())
    .catch(e=>fail('حفظ الرد', e));
}

function isLate(sh){
  const end = new Date(ST.date+'T00:00:00');
  if(sh==='صباحي'){ end.setHours(15,0,0,0); }
  else { end.setDate(end.getDate()+1); end.setHours(6,0,0,0); }
  return Date.now() > end.getTime();
}

function getQ(){ try{ return JSON.parse(localStorage.getItem('kq')||'[]'); }catch(e){ return []; } }
function setQ(q){ try{ localStorage.setItem('kq', JSON.stringify(q)); }catch(e){} }

async function flushQ(){
  const q = getQ();
  if(!q.length || !navigator.onLine || !ST.user) return;
  const keep = [];
  for(const it of q){
    try{ await setDoc(doc(fdb,'done',it.id), it.rec); }catch(e){ keep.push(it); }
  }
  setQ(keep);
}
window.addEventListener('online', flushQ);

  ST.cur = null;
  ST.photo = null;
  ST.taken = false;
  ST.busy = false;
  ST.showRef = false;
  ST.showChat = false;

  render();

  unsubDone = onSnapshot(query(collection(fdb,'done'), where('date','==',ST.date)),
    s=>{ DONE = s.docs.map(d=>({id:d.id,...d.data()})); refresh(); }, e=>console.warn(e));
}

onAuthStateChanged(auth, u=>{
  ST.authReady = true;
  ST.user = u;
  if(u){
    ST.role = (u.email||'').toLowerCase() === MANAGER_EMAIL ? 'mgr' : 'emp';
    ST.name = ST.role==='mgr' ? 'المدير' : (u.email||'').split('@')[0];
    ST.date = todayStr(); subDone(); subTasks();
    if(ST.role==='mgr') loadReport();
    flushQ();
  }else{
    ST.role=null; ST.cur=null; if(unsubDone) unsubDone(); if(unsubTasks) unsubTasks(); DONE=[]; TASKS=[];
  }
  render();
});

async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = document.getElementById('cam');
    if(v){ v.srcObject = camStream; v.style.display='block'; document.getElementById('ph').style.display='none'; }
  }catch(e){
    const ph = document.getElementById('ph');
    if(ph) ph.innerHTML = 'الكاميرا ما فتحتش. اسمح بالكاميرا من إعدادات المتصفح.';
  }
}

function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

function capture(){
  const v = document.getElementById('cam');
  if(!(v && v.srcObject && v.videoWidth)){ alert('الكاميرا مش مفتوحة.'); return; }
  const w = 640, h = Math.round(640*v.videoHeight/v.videoWidth);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const cx = c.getContext('2d');
  cx.drawImage(v,0,0,w,h);
  const px = cx.getImageData(0,0,w,h).data;
  let sum = 0, n = 0;
  for(let i=0; i<px.length; i+=16){ sum += (px[i]+px[i+1]+px[i+2])/3; n++; }
  if((n ? sum/n : 0) < 45){
    alert('الصورة معتمة جداً. وضّح الإضاءة وصوّر تاني.');
    return;
  }
  ST.photo = c.toDataURL('image/jpeg',0.5); ST.taken = true;
  stopCam();
  v.style.display='none';
  const img = document.getElementById('shot'); img.src = ST.photo; img.style.display='block';
  document.getElementById('ph').style.display='none';
  document.getElementById('capBtn').style.display='none';
  document.getElementById('startBtn').style.display='none';
  document.getElementById('retakeBtn').style.display='block';
  document.getElementById('sendBtn').style.display='block';
}

function retake(){ ST.photo=null; ST.taken=false; render(); startCam(); }
function closeTask(){ stopCam(); ST.cur=null; ST.busy=false; render(); }

async function submitPhoto(){
  if(ST.busy || !ST.taken) return;
  const t = findTask(ST.cur);
  const isTempTask = /حرارة|فحص الثلاجات|الفريزر|الهولدنج|الباردة|الساخنة/.test(t.name);
  let tempVal = null;
  if(isTempTask){
    const tempInput = document.getElementById('tempVal');
    tempInput ? tempVal = parseFloat(tempInput.value) : null;
    if(isNaN(tempVal)){ alert('يرجى إدخال قيمة درجة الحرارة.'); return; }
  }

  ST.busy = true;
  const sendBtn = document.getElementById('sendBtn');
  if(sendBtn){ sendBtn.disabled = true; sendBtn.innerText = '🔍 جاري الفحص بالذكاء الاصطناعي...'; }
  
  const check = await botCheckHygiene(t, ST.photo, tempVal);
  const now = new Date();
  const id = ST.date+'_'+SK[ST.shift||'صباحي']+'_'+t.id+'_'+ST.user.uid.slice(0,6);

  if(check.status === 'rejected'){
    const rejectedRec = {
      date: ST.date, ym: ST.date.slice(0,7),
      year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
      shift: ST.shift||'صباحي', taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
      time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
      photo: ST.photo, status: 'rejected', rejectReason: check.reason, tempVal: tempVal, violation: !!check.violation,
      aiNote: 'مرفوض أوتوماتيكياً'
    };
    try{ await setDoc(doc(fdb,'done',id), rejectedRec); }catch(e){}
    await sendTelegramAlert(`🚨 تنبيه مخالفة في كنساس!\n👤 الموظف: ${ST.name}\n📋 المهمة: ${t.name}\n❌ السبب: ${check.reason}`);
    ST.busy = false;
    closeTask();
    alert('⚠️ Not Done 👎🏻\nسبب الرفض: ' + check.reason + '\nتم تسجيلها كمخالفة.');
    return;
  }

  const rec = {
    date: ST.date, ym: ST.date.slice(0,7),
    year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
    shift: ST.shift||'صباحي', taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
    time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
    photo: ST.photo, status: check.status, tempVal: tempVal, violation: !!check.violation, aiNote: check.reason
  };
  try{
    await setDoc(doc(fdb,'done',id), rec);
    ST.busy = false; closeTask();
  }catch(e){
    ST.busy = false; 
    closeTask();
  }
}
