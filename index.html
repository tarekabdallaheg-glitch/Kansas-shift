<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2630;--muted:#6b7785;--main:#F5B800;--line:#e3e8ee;--ok:#2e7d32;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--text)}
#app{max-width:600px;margin:auto;padding:14px;min-height:100vh}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:21px}h2{font-size:17px}
.muted{font-size:13px;color:var(--muted)}
label{display:block;margin:10px 0 5px;font-size:13px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font-size:15px}
button{padding:12px;border:0;border-radius:10px;background:var(--main);color:#222;font-size:14px;font-weight:bold;cursor:pointer;margin-top:7px}
.sec{background:transparent;border:1px solid var(--main)}
.danger{color:var(--bad);border-color:var(--bad)}
.small{padding:7px;margin:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs,.btns{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button,.btns button{flex:1}
.tab.on{background:#222;color:#fff}
.task{padding:12px;border:1px solid var(--line);border-radius:10px;margin:7px 0;cursor:pointer}
.tag{font-size:12px;color:var(--muted)}
img,video{max-width:100%;border-radius:10px}
#cam{width:100%;display:none}
#shot{display:none;width:100%}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.bar div{height:100%;background:var(--main)}
.warn{padding:10px;background:#fff1cf;border-radius:9px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:7px;border-bottom:1px solid var(--line);text-align:center}
#app .brand{text-align:center;font-size:26px;font-weight:bold;color:#c62828}
@media(prefers-color-scheme:dark){
:root{--bg:#111820;--card:#1b2530;--text:#e8edf2;--muted:#a6b1bd;--line:#303c49}
}
</style>
</head>

async function login(){
 const email=$("email")?.value.trim();
 const password=$("password")?.value;

 try{

 }catch(e){
  console.error(e);
  msg("فشل تسجيل الدخول: "+(e.code||"راجع بيانات الدخول"));
 }
}

async function logout(){
 if(ST.stream)ST.stream.getTracks().forEach(t=>t.stop());

}

async function refresh(){
 try{
  const [ts,rs]=await Promise.all([
   getDocs(collection(db,"tasks")),
   getDocs(collection(db,"records"))
  ]);
  ST.tasks=ts.docs.map(d=>({id:d.id,...d.data()}));
  ST.records=rs.docs.map(d=>({id:d.id,...d.data()}));
 }catch(e){
  console.error(e);
  msg("تعذر تحميل البيانات. راجع صلاحيات Firestore.");
 }
}

async function startCam(){
 try{
  if(ST.stream)ST.stream.getTracks().forEach(t=>t.stop());
  ST.stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:"environment"},audio:false
  });
  const video=document.getElementById("cam");
  video.srcObject=ST.stream;
  await video.play();
 }catch(e){
  alert("تعذر فتح الكاميرا. تأكد من السماح باستخدام الكاميرا وفتح الموقع عبر HTTPS.");
 }
}

function capture(){
 const video=document.getElementById("cam");
 if(!video||!video.videoWidth){
  alert("افتح الكاميرا وانتظر ظهور الصورة أولًا.");
  return;
 }
 const canvas=document.getElementById("canvas");
 const maxWidth=640;
 const scale=Math.min(1,maxWidth/video.videoWidth);
 canvas.width=Math.round(video.videoWidth*scale);
 canvas.height=Math.round(video.videoHeight*scale);
 const ctx=canvas.getContext("2d");
 ctx.drawImage(video,0,0,canvas.width,canvas.height);
 ST.photo=canvas.toDataURL("image/jpeg",0.55);
 document.getElementById("photoArea").innerHTML=
  `<img class="preview" src="${ST.photo}" alt="صورة المهمة">`;
}

function retake(){
 ST.photo=null;
 const area=document.getElementById("photoArea");
 if(area)area.innerHTML="";
}

async function submitPhoto(){
 const task=ST.tasks.find(t=>t.id===ST.activeTask);
 if(!task||!ST.photo){
  alert("لازم تفتح الكاميرا وتلتقط صورة الأول.");
  return;
 }
 const btnMsg=document.getElementById("taskMsg");
 if(btnMsg)btnMsg.textContent="جارٍ إرسال المهمة...";
 try{
  const today=new Date().toISOString().slice(0,10);
  await addDoc(collection(db,"records"),{
   taskId:task.id,
   taskName:task.name,
   section:task.section||"عام",
   shift:ST.shift,
   date:today,
   userEmail:ST.user.email,
   userName:ST.user.displayName||ST.user.email,
   image:ST.photo,
   status:"review",
   managerNote:"",
   createdAt:new Date().toISOString()
  });
  if(ST.stream)ST.stream.getTracks().forEach(t=>t.stop());
  ST.stream=null;
  ST.activeTask=null;
  ST.photo=null;
  await refresh();
  render();
  alert("تم إرسال المهمة للمدير للمراجعة.");
 }catch(e){
  console.error(e);
  if(btnMsg)btnMsg.textContent="فشل الإرسال. تأكد من اتصال الإنترنت وصلاحيات Firebase.";
 }
}

function reviewView(){
 const records=[...ST.records].sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));

function statusText(s){
 if(s==="approved")return "✅ معتمدة";
 if(s==="rejected")return "❌ مرفوضة";
 return "⏳ في انتظار المراجعة";
}

async function decideRecord(id,status){
 const record=ST.records.find(r=>r.id===id);
 if(!record)return;
 const note=document.getElementById("note_"+id);
 try{
  await updateDoc(doc(db,"records",id),{
   status,
   managerNote:note?note.value.trim():"",
   reviewedAt:new Date().toISOString()
  });
  await refresh();
  render();
 }catch(e){
  alert("تعذر تحديث المهمة. راجع صلاحيات Firestore.");
 }
}

async function addTask(){
 const name=document.getElementById("newTaskName").value.trim();
 const section=document.getElementById("newTaskSection").value.trim()||"عام";
 const shift=document.getElementById("newTaskShift").value;
 if(!name){alert("اكتب اسم المهمة.");return;}
 try{
  await addDoc(collection(db,"tasks"),{
   name,section,shift,createdAt:new Date().toISOString()
  });
  await refresh();
  render();
 }catch(e){alert("تعذر إضافة المهمة. راجع صلاحيات Firestore.");}
}

async function removeTask(id){
 if(!confirm("متأكد إنك عايز تحذف المهمة؟"))return;
 try{
  await deleteDoc(doc(db,"tasks",id));
  await refresh();
  render();
 }catch(e){alert("تعذر حذف المهمة.");}
}

async function importDefaults(){
 if(!confirm("إضافة المهام الافتراضية غير الموجودة؟"))return;
 try{
  const existing=new Set(ST.tasks.map(t=>`${t.shift}|${t.section}|${t.name}`));
  for(const t of DEFAULT_TASKS){
   const key=`${t.shift}|${t.section}|${t.name}`;
   if(!existing.has(key)){
    await addDoc(collection(db,"tasks"),t);
   }
  }
  await refresh();
  render();
  alert("تمت مراجعة وإضافة المهام الافتراضية غير الموجودة.");
 }catch(e){alert("تعذرت إضافة المهام. راجع صلاحيات Firestore.");}
}

   userName:ST.user.displayName||ST.user.email,
   answer:"",
   createdAt:new Date().toISOString()
  });
  alert("تم إرسال السؤال.");
  render();
 }catch(e){alert("تعذر إرسال السؤال. راجع صلاحيات Firestore.");}
}

async function answerQ(id){
 const field=document.getElementById("answer_"+id);
 const answer=field?field.value.trim():"";
 if(!answer){alert("اكتب الرد الأول.");return;}
 try{
  await updateDoc(doc(db,"questions",id),{
   answer,answeredAt:new Date().toISOString()
  });
  await loadQuestions();
  render();
 }catch(e){alert("تعذر إرسال الرد.");}
}

function reportView(){
 const month=ST.month;
 const records=ST.records.filter(r=>(r.date||"").startsWith(month));
 const approved=records.filter(r=>r.status==="approved").length;
 const rejected=records.filter(r=>r.status==="rejected").length;
 const pending=records.filter(r=>r.status==="review").length;
 return `
 <h3>تقرير المهام</h3>
 <label>اختار الشهر</label>
 <input type="month" value="${month}" onchange="changeMonth(this.value)">
 <section class="card">
  <p>إجمالي المهام المرسلة: <b>${records.length}</b></p>
  <p>المهام المعتمدة: <b>${approved}</b></p>
  <p>المهام المرفوضة: <b>${rejected}</b></p>
  <p>في انتظار المراجعة: <b>${pending}</b></p>
  <button onclick="window.print()">طباعة التقرير</button>
 </section>
 `;
}

function changeMonth(value){
 ST.month=value;
 render();
}

function refView(){
 return `
 <section class="card">
  <h3>دليل التشغيل</h3>
  <p>١. نفّذ المهمة حسب تعليمات المدير وإجراءات المطعم.</p>
  <p>٢. تأكد من نظافة المكان والأدوات قبل التصوير.</p>
  <p>٣. التقط صورة واضحة تُظهر نتيجة تنفيذ المهمة.</p>
  <p>٤. أرسل المهمة وانتظر مراجعة المدير.</p>
  <p>٥. إذا تم رفض المهمة، راجع ملاحظة المدير وأعد التنفيذ عند الحاجة.</p>
  <button onclick="ST.showRef=false;setTab('rev')">رجوع للمهام</button>
 </section>
 `;
}

function render(){
 const app=document.getElementById("app");
 if(!app)return;
 if(!ST.ready){
  app.innerHTML=`<main><p>جارٍ تحميل التطبيق...</p></main>`;
  return;
 }
 if(!ST.user){
  app.innerHTML=loginView();
  return;
 }
 if(ST.activeTask){
  app.innerHTML=taskDetailView();
  return;
 }
 app.innerHTML=ST.role==="manager"?managerView():employeeView();
}

Object.assign(window,{
 login,logout,setShift,setTab,openTask,closeTask,
 startCam,capture,retake,submitPhoto,
 decideRecord,addTask,removeTask,importDefaults,
 askBot,answerQ,changeMonth,render
});

onAuthStateChanged(auth,async user=>{
 ST.user=user;
 ST.role=user&&user.email&&user.email.toLowerCase()===MANAGER_EMAIL.toLowerCase()
  ?"manager":"employee";
 ST.ready=true;
 if(user){
  await refresh();
  if(ST.role==="manager")await loadQuestions();
 }
 render();
});
</script>
</body>
</html>
