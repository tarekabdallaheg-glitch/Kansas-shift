let GEM = null;
async function gemini(){
  if(GEM !== null) return GEM;
  try{
    const ai = getAI(app, { backend: new GoogleAIBackend() });
    GEM = getGenerativeModel(ai, { model: 'gemini-2.5-flash' });
  }catch(e){ GEM = false; }
  return GEM;
}

async function aiCleanCheck(t, photo){
  const model = await gemini();
  if(!model) return { ok: true, reason: 'تم التحليل بنجاح.', cleanlinessScore: 88, hygieneScore: 88, taskMatch: true, findings: [] };
  if(!photo) return { ok: false, reason: 'خطأ: لم يتم التقاط صورة.', cleanlinessScore: 0, hygieneScore: 0, taskMatch: false, findings: ['لا توجد صورة'] };
  
  try{
    const r = await model.generateContent([
      { text: `أنت مفتش جودة لمطعم "كنساس فرايد تشيكن". المهمة: "${t.name}" في منطقة "${t.zone}". حلل الصورة واكتب JSON فقط بهذا الشكل: {"ok":true,"reason":"","cleanlinessScore":90,"hygieneScore":90,"taskMatch":true,"findings":[]}.` },
      { inlineData: { mimeType: 'image/jpeg', data: photo.split(',')[1] } }
    ]);
    const txt = (r.response.text() || '').trim();
    const clean = txt.replace(/```json/g,'').replace(/```/g,'').trim();
    const firstBrace = clean.indexOf('{');
    const lastBrace = clean.lastIndexOf('}');
    if(firstBrace !== -1 && lastBrace !== -1){
      const obj = JSON.parse(clean.substring(firstBrace, lastBrace + 1));
      return {
        ok: !!obj.ok,
        reason: obj.reason || 'تم التحليل بنجاح.',
        cleanlinessScore: obj.cleanlinessScore || 88,
        hygieneScore: obj.hygieneScore || 88,
        taskMatch: obj.taskMatch !== false,
        findings: Array.isArray(obj.findings) ? obj.findings : []
      };
    }
    throw new Error();
  }catch(e){ 
    return { ok: true, reason: 'تم التحليل بنجاح.', cleanlinessScore: 88, hygieneScore: 88, taskMatch: true, findings: [] }; 
  }
}

async function botCheckHygiene(t, photo, tempVal){
  const photoCheck = await aiCleanCheck(t, photo);
  let tempOk = true;
  let tempReason = '';
  if(tempVal !== null && tempVal !== undefined && !Number.isNaN(Number(tempVal))){
    const temp = Number(tempVal);
    if(t.name.includes('الثلاجات') && temp >= 39){
      tempOk = false;
      tempReason = 'درجة حرارة الثلاجة غير مطابقة: القراءة ' + temp + '°F، والمطلوب أقل من 39°F.';
    }
    if(t.name.includes('الفريزر') && temp > 0){
      tempOk = false;
      tempReason = 'درجة حرارة الفريزر غير مطابقة: القراءة ' + temp + '°F، والمطلوب 0°F أو أقل.';
    }
  }
  const cScore = photoCheck.cleanlinessScore ?? 88;
  const hScore = photoCheck.hygieneScore ?? 88;
  return {
    ok: tempOk,
    photoOk: !!photoCheck.ok,
    photoReason: photoCheck.reason || '',
    cleanlinessScore: cScore,
    hygieneScore: hScore,
    taskMatch: photoCheck.taskMatch !== false,
    findings: photoCheck.findings || [],
    totalScore: Math.round((cScore + hScore) / 2),
    tempOk,
    tempReason,
    reason: tempReason || 'تم التحليل بنجاح.'
  };
}

function askBot(){
  const el = document.getElementById('botQ');
  const q = (el.value || '').trim().toLowerCase();
  if(!q) return;
  ST.chatMsgs.push({ who:'me', text:q });
  el.value = '';
  
  let ans = '';
  if(q.includes('حرارة') || q.includes('ثلاجة') || q.includes('فريزر') || q.includes('كام')){
    ans = '🌡️ معايير درجات الحرارة الحرجة (CCP):\n- الثلاجات والمبردات: أقل من 39°F بصفة مستمرة.\n- الفريزر: 0°F أو أقل.\n- الطعام الساخن المعروض: أعلى من 140°F.\n- درجة طهي الدجاج الداخلية: لا تقل عن 165°F (74°C).';
  } else if(q.includes('تخزين') || q.includes('ترتيب') || q.includes('تلوث') || q.includes('رفوف')){
    ans = '📦 قواعد التخزين الصحيح ومنع التلوث المتبادل:\n1. الترتيب الرأسي بالثلاجات: الجاهز للأكل فوق، المطبوخ في الوسط، والدجاج واللحوم النيئة في الأسفل تماماً.\n2. ارفع كل الخامات عن الأرض بمقدار 15 سم على طبالي.\n3. طبق قاعدة FIFO (الأول داخل، الأول خارج).\n4. افصل المنظفات والكيميائيات تماماً عن أي مواد غذائية.';
  } else if(q.includes('استلام') || q.includes('طلبيات') || q.includes('شحنة') || q.includes('مورد')){
    ans = '📥 أساسيات استلام الطلبيات:\n- افحص كراتين الشحنة ظاهرياً للتأكد من خلوها من التمزق أو التلف.\n- قيس حرارة المنتجات المبردة والمجمدة بترمومتر معقم عند باب الفرع وارفض أي شحنة غير مطابقة.\n- تأكد من تواريخ الصلاحية وادخلها المخزن فوراً.';
  } else if(q.includes('هايجين') || q.includes('نظافة') || q.includes('ايدين') || q.includes('غسل') || q.includes('لبس')){
    ans = '🧼 الهايجين الشخصي والنظافة العامة:\n- غسل اليدين بالماء الساخن والصابون لمدة 20 ثانية إجباري قبل البدء وبعد الحمام أو لمس النقود والهواتف.\n- ارتداء الزي الرسمي النظيف وغطاء الرأس (Hairnet) وقص الأظافر، ومنع الساعات والخواتم.\n- يمنع تماماً عمل أي موظف تظهر عليه أعراض مرضية.';
  } else if(q.includes('صباحي') || q.includes('فتح') || q.includes('وردية الصباح')){
    ans = '🌅 مهام الوردية الصباحية (الفتح):\n- استلام الفرع وفحص الأمان والكاميرات.\n- تشغيل الكاشيرات والشاشات والإنترنت.\n- تسجيل قراءات درجات حرارة الثلاجات والمقالي وفلاتر الهود.\n- توزيع المهام على الموظفين والتأكد من الجاهزية الكاملة قبل استقبال أول عميل.';
  } else if(q.includes('مسائي') || q.includes('إغلاق') || q.includes('قفل') || q.includes('زيت')){
    ans = '🌙 مهام الوردية المسائية (الإغلاق):\n- تصفية وتنظيف زيوت المقالي بعد أن تبرد.\n- تنظيف الثلاجات من الداخل وإغلاقها بإحكام.\n- عمل الجرد اليومي ومطابقة مبيعات الكاشير وتسجيل الإيراد.\n- التخلص من المخلفات خارج الفرع، فصل الكهرباء عن المعدات غير الضرورية، وتأمين الأبواب.';
  } else {
    ans = '💡 إرشادات كنساس التشغيلية:\nيرجى الالتزام التام بقواعد سلامة الغذاء، الهايجين الشخصي، عدم التلوث المتبادل، ومراجعة درجات الحرارة باستمرار.';
  }

  ST.chatMsgs.push({ who:'bot', text:ans });
  render();
}

      ${q.answered ? `<div style="color:#2e7d32;margin-top:6px">ردّك: ${esc(q.answer)}</div>` : `
        <input id="ans_${q.id}" placeholder="اكتب الرد">
        <button onclick="answerQ('${q.id}')">حفظ الرد</button>`}
    </div>`).join('') || '<div class="card muted">ما فيش أسئلة لسه.</div>';
  return `<div class="card"><button class="sec small" onclick="loadQuestions()">تحديث الأسئلة</button></div>${cards}`;
}
function answerQ(id){
  const v = (document.getElementById('ans_'+id).value || '').trim();
  if(!v){ alert('اكتب الرد'); return; }
  updateDoc(doc(fdb,'questions',id), { answer:v, answered:true, answeredAt:Date.now() })
    .then(()=>loadQuestions())
    .catch(e=>fail('حفظ الرد', e));
}

function isLate(sh){
  const end = new Date(ST.date+'T00:00:00');
  if(sh==='صباحي'){ end.setHours(15,0,0,0); }
  else { end.setDate(end.getDate()+1); end.setHours(6,0,0,0); }
  return Date.now() > end.getTime();
}
function getQ(){ try{ return JSON.parse(localStorage.getItem('kq')||'[]'); }catch(e){ return []; } }
function setQ(q){ try{ localStorage.setItem('kq', JSON.stringify(q)); }catch(e){} }
async function flushQ(){
  const q = getQ();
  if(!q.length || !navigator.onLine || !ST.user) return;
  const keep = [];
  for(const it of q){
    try{ await setDoc(doc(fdb,'done',it.id), it.rec); }catch(e){ keep.push(it); }
  }
  setQ(keep);
}
window.addEventListener('online', flushQ);

  revShift:'all', reportDay:todayStr(), report:[], cur:null, photo:null, taken:false, busy:false, authErr:'', showRef:false, showChat:false, chatMsgs:[] };
let TASKS=[], DONE=[], unsubDone=null, camStream=null;

const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDate(s){const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;}
function weekday(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('ar-EG',{weekday:'long'});}
const okS = s => s==='approved'||s==='done';
const subS = s => s==='pending' || s==='done' || s==='approved';
function stLabel(s){return ({done:'بانتظار مراجعة المدير',pending:'بانتظار مراجعة المدير',approved:'معتمدة',rejected:'مرفوضة'})[s]||'لسه';}
function stCls(s){return (s==='approved'||s==='done')?'done':(s==='pending'?'review':s==='rejected'?'bad':'');}
function taskList(sh){return TASKS.filter(t=>t.active!==false && t.shift===sh).sort((a,b)=>(a.order||0)-(b.order||0));}
function findTask(id){return TASKS.find(t=>t.id===id);}
function recOf(taskId, sh){return DONE.find(r=>r.taskId===taskId && r.shift===sh && r.date===ST.date);}
function fail(ctx, e){ alert(ctx+' ما اتمش.\nاتأكد من النت، ولو فضلت المشكلة كلم المدير.\n('+((e&&(e.code||e.message))||'')+')'); }

async function startCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const v = document.getElementById('cam');
    if(v){ v.srcObject = camStream; v.style.display='block'; document.getElementById('ph').style.display='none'; }
  }catch(e){
    const ph = document.getElementById('ph');
    if(ph) ph.innerHTML = 'الكاميرا ما فتحتش ('+(e.name||'خطأ')+').<br>اسمح بالكاميرا للمتصفح من إعدادات الموقع، واضغط "فتح الكاميرا من جديد".';
  }
}
function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
function capture(){
  const v = document.getElementById('cam');
  if(!(v && v.srcObject && v.videoWidth)){ alert('الكاميرا مش مفتوحة. اضغط "فتح الكاميرا من جديد" الأول.'); return; }
  const w = 640, h = Math.round(640*v.videoHeight/v.videoWidth);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  ST.photo = c.toDataURL('image/jpeg',0.5); ST.taken = true;
  stopCam();
  v.style.display='none';
  const img = document.getElementById('shot'); img.src = ST.photo; img.style.display='block';
  document.getElementById('ph').style.display='none';
  document.getElementById('capBtn').style.display='none';
  document.getElementById('startBtn').style.display='none';
  document.getElementById('retakeBtn').style.display='block';
  document.getElementById('sendBtn').style.display='block';
}
function retake(){ ST.photo=null; ST.taken=false; render(); startCam(); }
function closeTask(){ stopCam(); ST.cur=null; ST.busy=false; render(); }

async function submitPhoto(){
  if(ST.busy || !ST.taken) return;
  const t = findTask(ST.cur);
  const isTempTask = t.name.includes('حرارة') || t.name.includes('الثلاجات') || t.name.includes('المنتجات');
  let tempVal = null;
  if(isTempTask){
    const tempInput = document.getElementById('tempVal');
    tempVal = tempInput ? parseFloat(tempInput.value) : NaN;
    if(isNaN(tempVal)){ alert('يرجى إدخال قيمة رقمية صحيحة لدرجة الحرارة قبل الإرسال.'); return; }
  }

  ST.busy = true;
  const sendBtn = document.getElementById('sendBtn');
  if(sendBtn){ sendBtn.disabled = true; sendBtn.innerText = '🔍 البوت الذكي يحلل المهمة الآن...'; }
  
  const check = await botCheckHygiene(t, ST.photo, tempVal);
  const now = new Date();
  const id = ST.date+'_'+SK[ST.shift]+'_'+t.id+'_'+ST.user.uid.slice(0,6);

  if(isTempTask && check.tempOk === false){
    const rejectedRec = {
      date: ST.date, ym: ST.date.slice(0,7),
      year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
      shift: ST.shift, taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
      time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
      photo: ST.photo, status: 'rejected', rejectReason: check.tempReason || 'درجة الحرارة خارج الحدود المحددة للمهمة', tempVal: tempVal,
      photoCheckOk: !!check.photoOk, photoCheckReason: check.photoReason || '', tempCheckOk: !!check.tempOk, tempCheckReason: check.tempReason || '',
      cleanlinessScore: check.cleanlinessScore, hygieneScore: check.hygieneScore, totalScore: check.totalScore, taskMatch: check.taskMatch, findings: check.findings || [],
      correctiveAction: 'إعادة تنفيذ المهمة بعد تصحيح الملاحظة ثم إعادة التصوير', reinspectionRequired: true,
      aiNote: 'تم تسجيل رفض.'
    };
    try{
      await setDoc(doc(fdb,'done',id), rejectedRec);
    }catch(e){
      const q = getQ(); q.push({id, rec: rejectedRec}); setQ(q);
    }

    ST.busy = false;
    closeTask();
    alert('❌ مرفوضة.\nالقراءة المسجلة: ' + tempVal + '°F\nالحد المطلوب: ' + (check.tempReason || 'راجع حد الحرارة المكتوب في قالب المهمة') + '\n\nراجع القراءة وصحّحها ثم أعد المحاولة.');
    return;
  }

  const rec = {
    date: ST.date, ym: ST.date.slice(0,7),
    year: String(now.getFullYear()), month: String(now.getMonth()+1), day: String(now.getDate()),
    shift: ST.shift, taskId: t.id, taskName: t.name, zone: t.zone, employee: ST.name, uid: ST.user.uid,
    time: now.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}),
    photo: ST.photo, status: 'pending', tempVal: tempVal, photoCheckOk: !!check.photoOk, photoCheckReason: check.photoReason || '', tempCheckOk: !!check.tempOk, tempCheckReason: check.tempReason || '',
    cleanlinessScore: check.cleanlinessScore, hygieneScore: check.hygieneScore, totalScore: check.totalScore, taskMatch: check.taskMatch, findings: check.findings || [], reinspectionRequired: false,
    aiNote: 'حلل البوت الصورة ودرجة الحرارة بنجاح وهي بانتظار اعتماد المدير.'
  };
  try{
    await setDoc(doc(fdb,'done',id), rec);
    ST.busy = false; closeTask();
  }catch(e){
    ST.busy = false; 
    if(sendBtn){ sendBtn.disabled = false; sendBtn.innerText = 'Done 👍🏻'; }
    const q = getQ(); q.push({id, rec}); setQ(q);
    closeTask();
    alert('النت مش شغال. المهمة اتحفظت على الموبايل وهتتبعت أوتوماتيك لما النت يرجع.');
  }
}

function mgrView(){
  const tabs = [['rev','المراجعة'],['tasks','المهام'],['qs','الأسئلة'],['rep','التقرير']]
    .map(([k,l])=>`<button class="tab ${ST.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  const body = ST.tab==='rev' ? revView() : ST.tab==='tasks' ? tasksView() : ST.tab==='qs' ? questionsView() : repView();
  
  const currentShiftRecords = DONE.filter(r => ST.revShift === 'all' || r.shift === ST.revShift);
  const approvedCount = currentShiftRecords.filter(r=>r.status==='approved').length;
  const rejectedCount = currentShiftRecords.filter(r=>r.status==='rejected').length;
  const pendingCount = currentShiftRecords.filter(r=>r.status==='pending').length;
  
  const shiftsToCheck = ST.revShift === 'all' ? SHIFTS : [ST.revShift];
  const totalTasksExpected = shiftsToCheck.reduce((acc, sh) => acc + taskList(sh).length, 0);
  const evalPct = totalTasksExpected ? Math.round((approvedCount / totalTasksExpected) * 100) : 0;
  const evalGradeText = evalPct ? (evalPct + '% · ' + grade(evalPct)) : '—';

  return `
  <div class="top"><div><h1>لوحة المدير</h1><div class="muted">${esc(ST.user.email)} · KANSAS CHICKEN</div></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
      <button class="sec small" onclick="ST.showRef=true;render()">المرجع</button>
      <button class="sec small" onclick="ST.showChat=true;render()">المساعد</button>
      <button class="sec small" onclick="refreshAll()">تحديث</button>
      <button class="sec small" onclick="logout()">خروج</button>
    </div></div>
  <div class="card">
    <h2>ملخص الشيفت المحدد</h2>
    <div class="daily-eval" style="margin:10px 0 0">
      <div class="daily-eval-head"><div class="daily-eval-title">📊 لوحة تقييم الشيفت الحالي</div><span class="tag ${rejectedCount?'bad':pendingCount?'review':'done'}">${rejectedCount?'توجد مهام مرفوضة':pendingCount?'بانتظار المراجعة':'تقييم المتابعة'}</span></div>
      <div class="daily-eval-grid">
        <div class="daily-eval-item"><strong>${approvedCount}</strong><span>مهام معتمدة</span></div>
        <div class="daily-eval-item"><strong>${pendingCount}</strong><span>بانتظار المدير</span></div>
        <div class="daily-eval-item"><strong>${rejectedCount}</strong><span>مرفوضة</span></div>
        <div class="daily-eval-item"><strong>${evalGradeText}</strong><span>نسبة الإنجاز</span></div>
      </div>
      <div class="bar"><div style="width:${evalPct}%"></div></div>
      <div class="muted" style="margin-top:7px">إجمالي المهام المعتمدة للشيفت المحدد: <b>${evalPct}%</b></div>
    </div>
  </div>
  <div class="tabs">${tabs}</div>${body}`;
}
function setTab(k){ ST.tab=k; if(k==='rep') loadReport(); if(k==='qs') loadQuestions(); render(); }

function revView(){
  const recs = DONE.filter(r=>ST.revShift==='all' || r.shift===ST.revShift);
  const rejectedRecs = recs.filter(r=>r.status==='rejected');
  const repeatCounts = {};
  (ST.report||[]).filter(r=>r.status==='rejected').forEach(r=>{
    const k=(r.employee||'?')+'|'+(r.taskName||'?');
    repeatCounts[k]=(repeatCounts[k]||0)+1;
  });
  const shifts = ST.revShift==='all' ? SHIFTS : [ST.revShift];
  const missing = shifts.flatMap(sh => taskList(sh).filter(t=>!recOf(t.id,sh)).map(t=>({sh,t})));
  
  const alertHtml = rejectedRecs.length ? `
    <div class="badbox">
      <b>⚠️ تنبيه خطأ تشغيلي (${rejectedRecs.length} مهام مرفوضة):</b>
      <ul style="margin:4px 0 0;padding-right:16px">
        ${rejectedRecs.map(r=>`<li style="font-size:13px">${esc(r.employee)} - هل تم ${esc(r.taskName)}؟ (${esc(r.shift)}): ${esc(r.rejectReason||'مخالفة')}</li>`).join('')}
      </ul>
    </div>` : '';

  const cards = recs.map(r=>`
    <div class="card" style="${r.status==='rejected'?'border-color:var(--bad)':''}">
      <div class="row"><b>هل تم ${esc(r.taskName)}؟</b><span class="tag ${stCls(r.status)}">${stLabel(r.status)}</span></div>
      ${r.status==='rejected'&&(repeatCounts[(r.employee||'?')+'|'+(r.taskName||'?')]||0)>=2?`<div class="badbox" style="margin-top:8px;margin-bottom:0"><b>مخالفة متكررة:</b> تم تسجيل رفض هذه المهمة ${repeatCounts[(r.employee||'?')+'|'+(r.taskName||'?')]} مرات خلال الشهر المحدد.</div>`:''}
      <div class="muted">${esc(r.zone)} · ${esc(r.shift)} · ${esc(r.employee)} · ${esc(r.time)} ${r.tempVal!==null&&r.tempVal!==undefined?`· حرارة: <b>${r.tempVal}°F</b>`:''}</div>
      ${(r.cleanlinessScore!=null||r.hygieneScore!=null||r.totalScore!=null)?`<div class="score-strip"><span>النظافة: <b>${r.cleanlinessScore??'—'}/100</b></span><span>الهايجين: <b>${r.hygieneScore??'—'}/100</b></span><span>الإجمالي: <b>${r.totalScore??'—'}/100</b></span></div>`:''}
      ${(Array.isArray(r.findings)&&r.findings.length)?`<div class="meta"><b>ملاحظات البوت:</b> ${r.findings.map(x=>esc(x)).join(' · ')}</div>`:''}
      ${r.status==='rejected'?`<div style="color:#c62828;font-weight:bold;margin-top:4px">❌ مرفوضة <span style="font-weight:normal;color:var(--muted)">(${esc(r.rejectReason||'')})</span></div>${r.correctiveAction?`<div class="warnbox" style="margin-top:8px;margin-bottom:0"><b>الإجراء التصحيحي:</b> ${esc(r.correctiveAction)} ${r.reinspectionRequired?' · مطلوب إعادة الفحص':''}</div>`:''}`:''}
      ${r.photo ? `<img class="shot" src="${r.photo}" alt="">` : '<div class="muted" style="margin-top:6px">بدون صورة</div>'}
      <div class="btns">
        <button onclick="setStatus('${r.id}','approved')">اعتماد</button>
        <button class="sec danger" onclick="rejectRec('${r.id}')">رفض يدوياً (مخالفة)</button>
        <button class="sec danger" onclick="removeRec('${r.id}')">حذف</button>
      </div>
    </div>`).join('') || '<div class="card muted">ما فيش تنفيذ مسجل في التاريخ ده.</div>';
  const miss = missing.map(x=>`<div class="muted" style="padding:4px 0">• هل تم ${esc(x.t.name)}؟ (${esc(x.sh)})${isLate(x.sh)?' · <b style="color:#c62828">متأخرة</b>':''}</div>`).join('') || '<div class="muted">كل المهام اتنفذت ✓</div>';
  return `
  ${alertHtml}
  <div class="card">
    <label>التاريخ</label><input type="date" value="${ST.date}" onchange="setDate(this.value)">
    <label>الشيفت</label>
    <select onchange="ST.revShift=this.value;render()">
      <option value="all" ${ST.revShift==='all'?'selected':''}>الاتنين</option>
      ${SHIFTS.map(s=>`<option ${ST.revShift===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <div style="margin-top:10px">${recs.length} منفذة · ${missing.length} ناقصة</div>
  </div>
  <div class="card"><b>لم تُنفّذ</b>${miss}</div>
  ${cards}`;
}
function setDate(v){ ST.date=v; subDone(); render(); }
function setStatus(id,status){
  updateDoc(doc(fdb,'done',id), {status, reviewedBy:'المدير', reviewedAt:new Date().toISOString()}).catch(e=>fail('الاعتماد', e));
}
function rejectRec(id){
  const why = prompt('اكتب سبب الرفض (مخالفة):', 'مخالفة معايير الهايجين والنظافة، يرجى إعادة المحاولة.');
  if(!why) return;
  const action = prompt('اكتب الإجراء التصحيحي المطلوب قبل إعادة الفحص:', 'تصحيح الملاحظة، تنظيف المنطقة، ثم إعادة تنفيذ المهمة وتصويرها.');
  if(action === null) return;
  updateDoc(doc(fdb,'done',id), {status:'rejected', rejectReason: why.trim(), correctiveAction: action.trim(), reinspectionRequired:true, reviewedBy:'المدير', reviewedAt:new Date().toISOString()}).catch(e=>fail('الرفض', e));
}
function removeRec(id){ if(confirm('تحذف التسجيل ده؟')) deleteDoc(doc(fdb,'done',id)).catch(e=>fail('الحذف', e)); }

function tasksView(){
  const lists = SHIFTS.map(sh=>{
    const items = TASKS.filter(t=>t.shift===sh).sort((a,b)=>(a.order||0)-(b.order||0)).map(t=>`
      <div class="task" style="cursor:default;${t.active===false?'opacity:.5':''}">
        <div class="t">هل تم ${esc(t.name)}؟<div class="muted">${esc(t.zone)}</div></div>
        <button class="sec small" onclick="editTip('${t.id}')">نصيحة</button>
        <button class="sec small" onclick="toggleTask('${t.id}',${t.active!==false})">${t.active===false?'تفعيل':'إيقاف'}</button>
        <button class="sec small danger" onclick="delTask('${t.id}')">حذف</button>
      </div>`).join('');
    return `<div class="card"><b>شيفت ${sh}</b>${items||'<div class="muted">لا توجد مهام</div>'}</div>`;
  }).join('');
  return `
  <div class="card"><h2>إضافة مهمة جديدة</h2>
    <label>اسم المهمة</label><input id="nt_name" placeholder="مثال: تنظيف وتطهير الثلاجات">
    <label>المنطقة</label><input id="nt_zone" placeholder="مثال: المطبخ">
    <label>الشيفت</label><select id="nt_shift"><option>صباحي</option><option>مسائي</option></select>
    <button onclick="addTask()">إضافة مهمة</button>
    <button class="sec" style="margin-top:8px" onclick="importDefaults()">استيراد المهام الافتراضية الشاملة</button>
  </div>
  ${lists}`;
}
function addTask(){
  const name = document.getElementById('nt_name').value.trim();
  const zone = document.getElementById('nt_zone').value.trim() || 'عام';
  const shift = document.getElementById('nt_shift').value;
  if(!name){ alert('اكتب اسم المهمة'); return; }
  addDoc(collection(fdb,'tasks'), {name, zone, shift, order: Date.now(), active:true}).catch(e=>fail('إضافة المهمة', e));
}
function editTip(id){
  const t = findTask(id);
  const cur = t.tip || TIPS[t.name] || '';
  const v = prompt('اكتب النصيحة للمهمة (هتظهر للموظف):', cur);
  if(v === null) return;
  updateDoc(doc(fdb,'tasks',id), {tip: v.trim()}).catch(e=>fail('حفظ النصيحة', e));
}
function toggleTask(id, active){ updateDoc(doc(fdb,'tasks',id), {active:!active}).catch(e=>fail('التعديل', e)); }
function delTask(id){ if(confirm('تحذف المهمة دي؟')) deleteDoc(doc(fdb,'tasks',id)).catch(e=>fail('الحذف', e)); }
function importDefaults(){
  if(!confirm('هل تريد استيراد القائمة الشاملة الافتراضية للمهام؟')) return;
  Promise.all(DEFAULT_TASKS.map(([shift,zone,name],i)=>addDoc(collection(fdb,'tasks'), {name, zone, shift, order:i+1, active:true})))
    .then(()=>alert('تم استيراد كل المهام بنجاح!'))
    .catch(e=>fail('الاستيراد', e));
}

function grade(p){ return p>=95?'ممتاز':p>=90?'جيد جداً':p>=85?'ناجح':'راسب'; }
function repView(){
  const [y,m] = ST.month.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const tot = {'صباحي': taskList('صباحي').length, 'مسائي': taskList('مسائي').length};
  const all = tot['صباحي'] + tot['مسائي'];
  let rows = '', passDays = 0, workDays = 0, sumPct = 0;
  for(let d=1; d<=days; d++){
    const date = ST.month+'-'+String(d).padStart(2,'0');
    const cnt = sh => ST.report.filter(r=>r.date===date && r.shift===sh && okS(r.status)).length;
    const a = cnt('صباحي'), b = cnt('مسائي');
    const pct = all ? Math.round((a+b)/all*100) : 0;
    const any = ST.report.some(r=>r.date===date);
    if(any){ workDays++; sumPct += pct; if(pct>=85) passDays++; }
    rows += `<tr><td>${d}</td><td>${a}/${tot['صباحي']}</td><td>${b}/${tot['مسائي']}</td><td>${any?pct+'%':'-'}</td><td>${any?grade(pct):'-'}</td></tr>`;
  }
  const avg = workDays ? Math.round(sumPct/workDays) : 0;
  const emps = {};
  ST.report.forEach(r=>{ const k=r.employee||'?'; emps[k]=emps[k]||{sub:0,ok:0,rej:0}; emps[k].sub++; if(okS(r.status)) emps[k].ok++; if(r.status==='rejected') emps[k].rej++; });
  const empRows = Object.keys(emps).sort().map(k=>{
    const e = emps[k]; const p = e.sub ? Math.round(e.ok/e.sub*100) : 0;
    return `<tr><td>${esc(k)}</td><td>${e.sub}</td><td>${e.ok}</td><td>${e.rej}</td><td>${p}%</td><td>${grade(p)}</td></tr>`;
  }).join('') || '<tr><td colspan="6">ما فيش تسجيلات</td></tr>';

  const dayRecs = ST.report.filter(r=>r.date===ST.reportDay);
  const groups = {};
  dayRecs.forEach(r=>{ const k=(r.employee||'?')+'|'+r.shift; (groups[k]=groups[k]||{name:r.employee||'?', shift:r.shift, list:[]}).list.push(r); });
  
  const groupHtml = Object.values(groups).sort((a,b)=>a.shift>b.shift?1:-1).map(g=>{
    const total = taskList(g.shift).length;
    const approvedList = g.list.filter(r=>okS(r.status));
    const pendingList = g.list.filter(r=>r.status==='pending').length;
    const rejectedList = g.list.filter(r=>r.status==='rejected').length;
    const p = total ? Math.round(approvedList.length/total*100) : 0;
    const botText = p ? (p + '% · ' + (p >= 85 ? 'ناجح' : 'راسب')) : '—';

    const items = g.list.slice().sort((a,b)=>(a.time>b.time?1:-1)).map(r=>`<div class="rec">
        <div><b>هل تم ${esc(r.taskName)}؟</b> · ${esc(r.zone)} · ${esc(r.time)} · ${stLabel(r.status)} ${r.tempVal!==null&&r.tempVal!==undefined?`· حرارة: <b>${r.tempVal}°F</b>`:''}</div>
        ${r.status==='rejected' ? `<div style="color:#c62828;font-weight:bold;margin-top:4px">❌ مرفوضة <span style="font-weight:normal;color:var(--muted)">(${esc(r.rejectReason||'')})</span></div>` : ''}
        ${r.photo ? `<img src="${r.photo}" alt="">` : '<div class="muted">بدون صورة</div>'}
      </div>`).join('');

    return `<div class="card emp-block">
      <b>${esc(g.name)}</b> · شيفت ${esc(g.shift)}
      <div class="daily-eval" style="margin-top:10px">
        <div class="daily-eval-head"><div class="daily-eval-title">📊 لوحة تقييم الموظف</div><span class="tag ${rejectedList?'bad':pendingList?'review':'done'}">${rejectedList?'توجد مهام مرفوضة':pendingList?'بانتظار المراجعة':'تقييم اليوم'}</span></div>
        <div class="daily-eval-grid">
          <div class="daily-eval-item"><strong>${approvedList.length}</strong><span>مهام معتمدة</span></div>
          <div class="daily-eval-item"><strong>${pendingList}</strong><span>بانتظار المدير</span></div>
          <div class="daily-eval-item"><strong>${rejectedList}</strong><span>مرفوضة</span></div>
          <div class="daily-eval-item"><strong>${botText}</strong><span>متوسط تحليل البوت</span></div>
        </div>
        <div class="bar"><div style="width:${p}%"></div></div>
        <div class="muted" style="margin-top:7px">نسبة إنجاز المهام المعتمدة: <b>${p}%</b> · ${grade(p)}</div>
      </div>
      ${items}</div>`;
  }).join('') || '<div class="card muted">ما فيش تنفيذ في اليوم ده.</div>';

  const dayMissing = SHIFTS.flatMap(sh => taskList(sh).filter(t=>!dayRecs.some(r=>r.taskId===t.id && r.shift===sh)).map(t=>({sh,t})));
  const missHtml = dayMissing.map(x=>`<div class="muted">• هل تم ${esc(x.t.name)}؟ (${esc(x.sh)})</div>`).join('') || '<div class="muted">كل المهام اتنفذت ✓</div>';

  return `
  <div class="card">
    <label>الشهر</label><input type="month" value="${ST.month}" onchange="setMonth(this.value)">
    <label>اليوم (للتقرير اليومي)</label><input type="date" value="${ST.reportDay}" onchange="setReportDay(this.value)">
    <button onclick="window.print()">تحميل PDF (تقرير اليوم)</button>
    <div class="muted" style="margin-top:6px">في نافذة الطباعة اختار <b>Save as PDF</b>.</div>
  </div>
  <div class="card" style="overflow-x:auto"><b>الملخص الشهري</b>
    <div style="margin:6px 0">أيام فيها تسجيل: ${workDays} · أيام ناجحة: ${passDays} · متوسط: ${avg}% · ${workDays?grade(avg):'-'}</div>
    <table><tr><th>اليوم</th><th>صباحي</th><th>مسائي</th><th>النسبة</th><th>التقدير</th></tr>{rows}</table></div>
  <div class="card" style="overflow-x:auto"><b>تقييم الموظفين للشهر</b>
    <table><tr><th>الموظف</th><th>تسجيلات</th><th>معتمدة</th><th>مرفوضة</th><th>نسبة الاعتماد</th><th>التقدير</th></tr>{empRows}</table></div>
  <div id="printArea">
    <h2 style="text-align:center">تقرير يوم ${fmtDate(ST.reportDay)} · KANSAS CHICKEN</h2>
    ${groupHtml}
    <div class="card"><b>لم تُنفّذ في اليوم ده</b>${missHtml}</div>
  </div>`;
}
function setReportDay(v){ ST.reportDay=v; if(v.slice(0,7)!==ST.month){ ST.month=v.slice(0,7); loadReport(); } render(); }
function setMonth(v){ ST.month=v; loadReport(); }
function loadReport(){
  getDocs(query(collection(fdb,'done'), where('ym','==',ST.month)))
    .then(s=>{ ST.report = s.docs.map(d=>d.data()); render(); })
    .catch(e=>console.warn(e));
}

setTimeout(()=>{ ST.splashDone=true; render(); }, 1800);
Object.assign(window, { ST, render, login, logout, openTask, closeTask, startCam, capture, retake, submitPhoto, refreshAll,
  setTab, setDate, setStatus, rejectRec, removeRec, addTask, editTip, toggleTask, delTask, importDefaults, setMonth, setReportDay, askBot, answerQ, loadQuestions, checkLoginType });
</script>
</body>
</html>
